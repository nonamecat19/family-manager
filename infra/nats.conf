# NATS server configuration for the production box. Mounted read-only at /etc/nats/nats.conf and
# passed with `-c`; the compose command carries no other flags, deliberately.
#
# Why a file at all: JetStream's store limits are config-only settings. `--max_file_store` and
# `--max_mem_store` are NOT nats-server flags — `nats-server -h` lists exactly two JetStream
# options, `-js/--jetstream` and `-sd/--store_dir` — and passing them makes the server exit at
# startup with "flag provided but not defined". Since family, finance and recipes all wait on
# nats being healthy, that is not a degraded NATS; it is three of the four services down.
#
# Why the limits: the JetStream default is bounded only by the size of the filesystem, so a
# runaway producer can fill a 20 GB disk and take Postgres down with it. 512 MB is far past what
# this workload's event streams hold and far short of hurting anything else on the box.
#
# Why nothing is left on the command line: the two sources do not merge cleanly, and they fail
# asymmetrically. `-sd /data` alongside store_dir here aborts the server with "Duplicate
# 'store_dir' configuration", while `-m 8222` alongside http_port is silently tolerated. A rule
# of "each setting is stated in exactly one place, and that place is this file" avoids having to
# remember which of the two a given key behaves like. Note that the `jetstream` block enables
# JetStream on its own — `-js` is not needed either.

# Monitoring listener. The compose healthcheck polls /healthz on this port; it is what caught
# the bad flags. Internal to the compose network — never published to the host, since it is an
# unauthenticated status endpoint.
http_port: 8222

jetstream {
	# The natsdata volume. The server creates and uses /data/jetstream beneath it.
	store_dir: "/data"
	max_file_store: 512MB
	max_mem_store: 32MB
}
