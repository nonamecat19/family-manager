services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 320m
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
    logging: *bounded-logs

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      AUTH_HOST: ${AUTH_HOST}
      FAMILY_HOST: ${FAMILY_HOST}
      FINANCE_HOST: ${FINANCE_HOST}
      RECIPES_HOST: ${RECIPES_HOST}
      NOTES_HOST: ${NOTES_HOST}
      NOTIFICATIONS_HOST: ${NOTIFICATIONS_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      auth:
        condition: service_healthy
      family:
        condition: service_started
      finance:
        condition: service_started
      recipes:
        condition: service_started
      notes:
        condition: service_started
      notifications:
        condition: service_started
    restart: unless-stopped
    mem_limit: 96m
    logging: *bounded-logs


  auth:
    image: ghcr.io/nonamecat19/family-manager/auth:${IMAGE_TAG:-latest}
    environment:
      AUTH_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable
      AUTH_SIGNING_KEY_FILE: /run/secrets/auth-signing-key
      AUTH_FAMILY_ADDR: http://family:9090
      AUTH_HTTP_PORT: "8080"
      AUTH_LOG_JSON: "true"
      AUTH_LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_HASH_CONCURRENCY: "1"
      AUTH_LOGIN_FAILURE_THRESHOLD: ${LOGIN_FAILURE_THRESHOLD:-6}
      AUTH_LOGIN_LOCKOUT_BASE: ${LOGIN_LOCKOUT_BASE:-15s}
      AUTH_LOGIN_LOCKOUT_MAX: ${LOGIN_LOCKOUT_MAX:-10m}
      GOMEMLIMIT: 140MiB
      GOGC: "50"
    secrets:
      - auth-signing-key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    mem_limit: 160m
    logging: *bounded-logs

  family:
    image: ghcr.io/nonamecat19/family-manager/family:${IMAGE_TAG:-latest}
    environment:
      FAMILY_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/family?sslmode=disable
      FAMILY_JWKS_URL: ${JWKS_URL:-http://auth:8080/.well-known/jwks.json}
      FAMILY_NATS_URL: nats://nats:4222
      FAMILY_HTTP_PORT: "8080"
      FAMILY_GRPC_PORT: "9090"
      FAMILY_LOG_JSON: "true"
      FAMILY_LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: 140MiB
      GOGC: "50"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    mem_limit: 160m
    logging: *bounded-logs

  finance:
    image: ghcr.io/nonamecat19/family-manager/finance:${IMAGE_TAG:-latest}
    environment:
      FINANCE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/finance?sslmode=disable
      FINANCE_JWKS_URL: ${JWKS_URL:-http://auth:8080/.well-known/jwks.json}
      FINANCE_NATS_URL: nats://nats:4222
      FINANCE_HTTP_PORT: "8080"
      FINANCE_GRPC_PORT: "9090"
      FINANCE_BASE_CURRENCY: ${FINANCE_BASE_CURRENCY:-UAH}
      FINANCE_TIMEZONE: ${FINANCE_TIMEZONE:-Europe/Kyiv}
      FINANCE_LOG_JSON: "true"
      FINANCE_LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: 140MiB
      GOGC: "50"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    mem_limit: 160m
    logging: *bounded-logs

  notifications:
    image: ghcr.io/nonamecat19/family-manager/notifications:${IMAGE_TAG:-latest}
    environment:
      NOTIFICATIONS_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notifications?sslmode=disable
      NOTIFICATIONS_JWKS_URL: ${JWKS_URL:-http://auth:8080/.well-known/jwks.json}
      NOTIFICATIONS_NATS_URL: nats://nats:4222
      NOTIFICATIONS_FAMILY_ADDR: http://family:9090
      NOTIFICATIONS_HTTP_PORT: "8080"
      NOTIFICATIONS_EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      NOTIFICATIONS_LOG_JSON: "true"
      NOTIFICATIONS_LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: 140MiB
      GOGC: "50"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      auth:
        condition: service_healthy
      family:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    mem_limit: 160m
    logging: *bounded-logs

  recipes:
    image: ghcr.io/nonamecat19/family-manager/recipes:${IMAGE_TAG:-latest}
    environment:
      RECIPES_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/recipes?sslmode=disable
      RECIPES_JWKS_URL: ${JWKS_URL:-http://auth:8080/.well-known/jwks.json}
      RECIPES_NATS_URL: nats://nats:4222
      RECIPES_HTTP_PORT: "8080"
      RECIPES_STORAGE_PROVIDER: r2
      RECIPES_STORAGE_ENDPOINT: ${R2_ENDPOINT}
      RECIPES_STORAGE_ACCESS_KEY: ${R2_ACCESS_KEY_ID}
      RECIPES_STORAGE_SECRET_KEY: ${R2_SECRET_ACCESS_KEY}
      RECIPES_STORAGE_USE_SSL: "true"
      RECIPES_STORAGE_BUCKET: ${R2_BUCKET:-recipes}
      RECIPES_STORAGE_PUBLIC_URL: ${R2_PUBLIC_URL}
      RECIPES_LOG_JSON: "true"
      RECIPES_LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: 140MiB
      GOGC: "50"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    mem_limit: 160m
    logging: *bounded-logs

  notes:
    image: ghcr.io/nonamecat19/family-manager/notes:${IMAGE_TAG:-latest}
    environment:
      NOTES_DB_URL: jdbc:postgresql://postgres:5432/notes
      NOTES_DB_USER: ${POSTGRES_USER}
      NOTES_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NOTES_JWKS_URL: ${JWKS_URL:-http://auth:8080/.well-known/jwks.json}
      NOTES_STORAGE_PROVIDER: r2
      NOTES_STORAGE_ENDPOINT: ${R2_ENDPOINT}
      NOTES_STORAGE_ACCESS_KEY: ${R2_ACCESS_KEY_ID}
      NOTES_STORAGE_SECRET_KEY: ${R2_SECRET_ACCESS_KEY}
      NOTES_STORAGE_USE_SSL: "true"
      NOTES_STORAGE_BUCKET: ${R2_NOTES_BUCKET:-notes}
      NOTES_STORAGE_PUBLIC_URL: ${R2_NOTES_PUBLIC_URL}
      # The JVM sizes its heap against the cgroup, but MaxRAMPercentage counts only the heap:
      # metaspace, code cache, thread stacks and direct buffers live outside it. 55% of 448m
      # leaves ~200m of native headroom, which is what keeps this from being OOM-killed as the
      # largest single tenant on a 1.6 GiB box. The Dockerfile's default of 75% does not.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=55 -XX:+UseSerialGC -Xss512k
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    # Spring's own probe is /actuator/health; /healthz is the alias deploy.sh probes, the same
    # path as every Go service here.
    restart: unless-stopped
    mem_limit: 448m
    logging: *bounded-logs

  telegram:
    image: ghcr.io/nonamecat19/family-manager/telegram:${IMAGE_TAG:-latest}
    environment:
      TELEGRAM_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/telegram?sslmode=disable
      # Long polling, not webhook. ADR 0010 prefers a webhook on a box that already runs Caddy,
      # but a webhook needs a public hostname for this service and there is no DNS record for
      # one; polling needs nothing published. Switching later is a config change, not a rebuild:
      # set TELEGRAM_MODE=webhook, TELEGRAM_PUBLIC_URL and TELEGRAM_WEBHOOK_SECRET, and give
      # Caddy a host that proxies /tg/ here.
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      TELEGRAM_TOKEN_KEY_FILE: /run/secrets/telegram-token-key
      TELEGRAM_AUTH_ADDR: http://auth:8080
      TELEGRAM_FAMILY_ADDR: http://family:8080
      TELEGRAM_FINANCE_ADDR: http://finance:8080
      TELEGRAM_RECIPES_ADDR: http://recipes:8080
      TELEGRAM_NOTES_ADDR: http://notes:8080
      # A bot with no token here is simply not started, so an unused bot needs no placeholder.
      TELEGRAM_FINANCE_TOKEN: ${TELEGRAM_FINANCE_TOKEN:-}
      TELEGRAM_RECIPES_TOKEN: ${TELEGRAM_RECIPES_TOKEN:-}
      TELEGRAM_NOTES_TOKEN: ${TELEGRAM_NOTES_TOKEN:-}
      TELEGRAM_FAMILY_TOKEN: ${TELEGRAM_FAMILY_TOKEN:-}
      TELEGRAM_HTTP_PORT: "8080"
      TELEGRAM_LOG_JSON: "true"
      TELEGRAM_LOG_LEVEL: ${LOG_LEVEL:-info}
      GOMEMLIMIT: 80MiB
      GOGC: "50"
    secrets:
      - telegram-token-key
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    restart: unless-stopped
    mem_limit: 96m
    logging: *bounded-logs

secrets:
  auth-signing-key:
    file: ./secrets/auth-signing-key.pem
  telegram-token-key:
    file: ./secrets/telegram-token-key

volumes:
  pgdata:
    name: family-manager_pgdata18
  natsdata:
  caddydata:
  caddyconfig:
