version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: gomod
    directories:
      - /libs/go/auth
      - /libs/go/database
      - /libs/go/events
      - /libs/go/logger
      - /libs/go/rpc
      - /libs/go/storage
      - /sdk/go
      - /services/auth
      - /services/family
      - /services/finance
      - /services/recipes
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(go)"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(pnpm)"
    groups:
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "react-native*"
    ignore:
      - dependency-name: "react"
        versions: ["19.x"]
      - dependency-name: "react-dom"
        versions: ["19.x"]
      - dependency-name: "@types/react"
        versions: ["19.x"]
