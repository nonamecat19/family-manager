syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";


service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc CreateLinkToken(CreateLinkTokenRequest) returns (CreateLinkTokenResponse);
  rpc RedeemLinkToken(RedeemLinkTokenRequest) returns (RedeemLinkTokenResponse);
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);
  rpc StartDeviceLogin(StartDeviceLoginRequest) returns (StartDeviceLoginResponse);
  rpc PollDeviceLogin(PollDeviceLoginRequest) returns (PollDeviceLoginResponse);
  rpc ApproveDeviceLogin(ApproveDeviceLoginRequest) returns (ApproveDeviceLoginResponse);
  rpc DenyDeviceLogin(DenyDeviceLoginRequest) returns (DenyDeviceLoginResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message RegisterResponse {
  string user_id = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message CreateLinkTokenRequest {
  string provider = 1;
}

message CreateLinkTokenResponse {
  string token = 1;
  int64 expires_in = 2;
}

message RedeemLinkTokenRequest {
  string token = 1;
  string provider = 2;
  string external_id = 3;
}

message RedeemLinkTokenResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_in = 4;
}

message Identity {
  string provider = 1;
  string external_id = 2;
  google.protobuf.Timestamp linked_at = 3;
}

message ListIdentitiesRequest {}

message ListIdentitiesResponse {
  repeated Identity identities = 1;
}

message UnlinkRequest {
  string provider = 1;
  string external_id = 2;
}

message UnlinkResponse {}

enum DeviceLoginKind {
  DEVICE_LOGIN_KIND_UNSPECIFIED = 0;
  DEVICE_LOGIN_KIND_DEVICE = 1;
  DEVICE_LOGIN_KIND_TELEGRAM = 2;
}

enum DeviceLoginStatus {
  DEVICE_LOGIN_STATUS_UNSPECIFIED = 0;
  DEVICE_LOGIN_STATUS_PENDING = 1;
  DEVICE_LOGIN_STATUS_SLOW_DOWN = 2;
  DEVICE_LOGIN_STATUS_APPROVED = 3;
  DEVICE_LOGIN_STATUS_DENIED = 4;
  DEVICE_LOGIN_STATUS_EXPIRED = 5;
}

message StartDeviceLoginRequest {
  DeviceLoginKind kind = 1;
}

message StartDeviceLoginResponse {
  string device_code = 1;
  string user_code = 2;
  google.protobuf.Timestamp expires_at = 3;
  int32 interval_seconds = 4;
  string telegram_start_payload = 5;
}

message PollDeviceLoginRequest {
  string device_code = 1;
}

message PollDeviceLoginResponse {
  DeviceLoginStatus status = 1;
  int32 interval_seconds = 2;
  string access_token = 3;
  string refresh_token = 4;
  int64 expires_in = 5;
}

message ApproveDeviceLoginRequest {
  string user_code = 1;
}

message ApproveDeviceLoginResponse {
  DeviceLoginKind kind = 1;
}

message DenyDeviceLoginRequest {
  string user_code = 1;
}

message DenyDeviceLoginResponse {}
