syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";


service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc CreateLinkToken(CreateLinkTokenRequest) returns (CreateLinkTokenResponse);
  rpc RedeemLinkToken(RedeemLinkTokenRequest) returns (RedeemLinkTokenResponse);
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message RegisterResponse {
  string user_id = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message CreateLinkTokenRequest {
  string provider = 1;
}

message CreateLinkTokenResponse {
  string token = 1;
  int64 expires_in = 2;
}

message RedeemLinkTokenRequest {
  string token = 1;
  string provider = 2;
  string external_id = 3;
}

message RedeemLinkTokenResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_in = 4;
}

message Identity {
  string provider = 1;
  string external_id = 2;
  google.protobuf.Timestamp linked_at = 3;
}

message ListIdentitiesRequest {}

message ListIdentitiesResponse {
  repeated Identity identities = 1;
}

message UnlinkRequest {
  string provider = 1;
  string external_id = 2;
}

message UnlinkResponse {}
