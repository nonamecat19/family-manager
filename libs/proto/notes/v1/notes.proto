syntax = "proto3";

package notes.v1;


import "google/protobuf/timestamp.proto";

service NotesService {
  rpc CreateNotebook(CreateNotebookRequest) returns (CreateNotebookResponse);
  rpc ListNotebooks(ListNotebooksRequest) returns (ListNotebooksResponse);
  rpc UpdateNotebook(UpdateNotebookRequest) returns (UpdateNotebookResponse);
  rpc DeleteNotebook(DeleteNotebookRequest) returns (DeleteNotebookResponse);

  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse);
  rpc MoveNote(MoveNoteRequest) returns (MoveNoteResponse);
  rpc ToggleStar(ToggleStarRequest) returns (ToggleStarResponse);
  rpc ArchiveNote(ArchiveNoteRequest) returns (ArchiveNoteResponse);
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);
  rpc UploadNoteImage(UploadNoteImageRequest) returns (UploadNoteImageResponse);

  rpc Search(SearchRequest) returns (SearchResponse);

  rpc ShareNote(ShareNoteRequest) returns (ShareNoteResponse);
  rpc ShareNotebook(ShareNotebookRequest) returns (ShareNotebookResponse);
  rpc Unshare(UnshareRequest) returns (UnshareResponse);
  rpc ListShares(ListSharesRequest) returns (ListSharesResponse);
  rpc ListSharedWithMe(ListSharedWithMeRequest) returns (ListSharedWithMeResponse);

  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc ResolveComment(ResolveCommentRequest) returns (ResolveCommentResponse);

  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);
}

enum BlockType {
  BLOCK_TYPE_UNSPECIFIED = 0;
  BLOCK_TYPE_PARAGRAPH = 1;
  BLOCK_TYPE_HEADING = 2;
  BLOCK_TYPE_TODO = 3;
  BLOCK_TYPE_BULLET = 4;
  BLOCK_TYPE_NUMBERED = 5;
  BLOCK_TYPE_QUOTE = 6;
  BLOCK_TYPE_CODE = 7;
  BLOCK_TYPE_IMAGE = 8;
  BLOCK_TYPE_DIVIDER = 9;
}

enum SharePermission {
  SHARE_PERMISSION_UNSPECIFIED = 0;
  SHARE_PERMISSION_VIEW = 1;
  SHARE_PERMISSION_EDIT = 2;
}

enum ShareSubject {
  SHARE_SUBJECT_UNSPECIFIED = 0;
  SHARE_SUBJECT_MEMBER = 1;
  SHARE_SUBJECT_FAMILY = 2;
}

enum NoteSort {
  NOTE_SORT_UNSPECIFIED = 0;
  NOTE_SORT_UPDATED = 1;
  NOTE_SORT_CREATED = 2;
  NOTE_SORT_TITLE = 3;
}

enum SearchFacet {
  SEARCH_FACET_UNSPECIFIED = 0;
  SEARCH_FACET_ALL = 1;
  SEARCH_FACET_NOTES = 2;
  SEARCH_FACET_TASKS = 3;
  SEARCH_FACET_NOTEBOOKS = 4;
}

enum ActivityKind {
  ACTIVITY_KIND_UNSPECIFIED = 0;
  ACTIVITY_KIND_CREATED = 1;
  ACTIVITY_KIND_EDITED = 2;
  ACTIVITY_KIND_TASK_CHECKED = 3;
  ACTIVITY_KIND_TASK_UNCHECKED = 4;
  ACTIVITY_KIND_COMMENTED = 5;
  ACTIVITY_KIND_SHARED = 6;
}

message Block {
  string id = 1;
  BlockType type = 2;
  string text = 3;
  bool checked = 4;
  int32 level = 5;
  string image_url = 6;
  string language = 7;
}

message Notebook {
  string id = 1;
  string family_id = 2;
  string owner_user_id = 3;
  string parent_id = 4;
  string name = 5;
  bool archived = 6;
  int32 note_count = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Share {
  string id = 1;
  ShareSubject subject = 2;
  string member_user_id = 3;
  SharePermission permission = 4;
  string granted_by_user_id = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Note {
  string id = 1;
  string family_id = 2;
  string owner_user_id = 3;
  string notebook_id = 4;
  string title = 5;
  repeated Block blocks = 6;
  bool starred = 7;
  bool archived = 8;
  int64 version = 9;
  string last_edited_by_user_id = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  repeated Share shares = 13;
  bool shared = 14;
  int32 task_total = 15;
  int32 task_done = 16;
  string preview = 17;
  bool can_edit = 18;
}

message Comment {
  string id = 1;
  string note_id = 2;
  string author_user_id = 3;
  string body = 4;
  bool resolved = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Activity {
  string id = 1;
  string note_id = 2;
  string actor_user_id = 3;
  ActivityKind kind = 4;
  string detail = 5;
  google.protobuf.Timestamp created_at = 6;
}


message CreateNotebookRequest {
  string name = 1;
  string parent_id = 2;
}
message CreateNotebookResponse {
  Notebook notebook = 1;
}

message ListNotebooksRequest {
  bool include_archived = 1;
}
message ListNotebooksResponse {
  repeated Notebook notebooks = 1;
}

message UpdateNotebookRequest {
  string notebook_id = 1;
  string name = 2;
  string parent_id = 3;
  bool archived = 4;
}
message UpdateNotebookResponse {
  Notebook notebook = 1;
}

message DeleteNotebookRequest {
  string notebook_id = 1;
}
message DeleteNotebookResponse {}


message CreateNoteRequest {
  string notebook_id = 1;
  string title = 2;
  repeated Block blocks = 3;
  string client_id = 4;
}
message CreateNoteResponse {
  Note note = 1;
}

message GetNoteRequest {
  string note_id = 1;
}
message GetNoteResponse {
  Note note = 1;
}

message ListNotesRequest {
  string notebook_id = 1;
  bool starred_only = 2;
  bool include_archived = 3;
  bool shared_only = 4;
  NoteSort sort = 5;
  int32 page_size = 6;
  bool archived_only = 7;
}
message ListNotesResponse {
  repeated Note notes = 1;
}

message UpdateNoteRequest {
  string note_id = 1;
  string title = 2;
  repeated Block blocks = 3;
  int64 expected_version = 4;
}
message UpdateNoteResponse {
  Note note = 1;
}

message MoveNoteRequest {
  string note_id = 1;
  string notebook_id = 2;
}
message MoveNoteResponse {
  Note note = 1;
}

message ToggleStarRequest {
  string note_id = 1;
  bool starred = 2;
}
message ToggleStarResponse {
  Note note = 1;
}

message ArchiveNoteRequest {
  string note_id = 1;
  bool archived = 2;
}
message ArchiveNoteResponse {
  Note note = 1;
}

message DeleteNoteRequest {
  string note_id = 1;
}
message DeleteNoteResponse {}

message UploadNoteImageRequest {
  string note_id = 1;
  bytes image = 2;
  string content_type = 3;
}
message UploadNoteImageResponse {
  string image_url = 1;
}


message SearchHit {
  SearchFacet kind = 1;
  string note_id = 2;
  string notebook_id = 3;
  string title = 4;
  string context = 5;
  string snippet = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message SearchRequest {
  string query = 1;
  SearchFacet facet = 2;
  int32 limit = 3;
}
message SearchResponse {
  repeated SearchHit hits = 1;
  int32 elapsed_ms = 2;
  int32 searched_notes = 3;
}


message ShareNoteRequest {
  string note_id = 1;
  ShareSubject subject = 2;
  string member_user_id = 3;
  SharePermission permission = 4;
}
message ShareNoteResponse {
  Share share = 1;
}

message ShareNotebookRequest {
  string notebook_id = 1;
  ShareSubject subject = 2;
  string member_user_id = 3;
  SharePermission permission = 4;
}
message ShareNotebookResponse {
  Share share = 1;
}

message UnshareRequest {
  string note_id = 1;
  string notebook_id = 2;
  string share_id = 3;
}
message UnshareResponse {}

message ListSharesRequest {
  string note_id = 1;
  string notebook_id = 2;
}
message ListSharesResponse {
  repeated Share shares = 1;
}

message ListSharedWithMeRequest {
  int32 page_size = 1;
}
message ListSharedWithMeResponse {
  repeated Note notes = 1;
  repeated Notebook notebooks = 2;
}


message AddCommentRequest {
  string note_id = 1;
  string body = 2;
}
message AddCommentResponse {
  Comment comment = 1;
}

message ListCommentsRequest {
  string note_id = 1;
  bool include_resolved = 2;
}
message ListCommentsResponse {
  repeated Comment comments = 1;
}

message ResolveCommentRequest {
  string comment_id = 1;
  bool resolved = 2;
}
message ResolveCommentResponse {
  Comment comment = 1;
}


message ListActivityRequest {
  string note_id = 1;
  int32 limit = 2;
}
message ListActivityResponse {
  repeated Activity activity = 1;
}
