// ---------------------------------------------------------------------------
// Events published on `finance.<entity>.<verb>` (libs/go/events). Domain events are contracts
// too: every consumer reads these messages, not the service's tables.
// ---------------------------------------------------------------------------

// finance.transaction.created
message TransactionCreatedEvent {
  string family_id = 1;
  string transaction_id = 2;
  string member_id = 3;
  string account_id = 4;
  string category_id = 5;
  string group_id = 6;
  TransactionType type = 7;
  Money amount = 8;
  string occurred_on = 9;
  string template_id = 10;
  string actor_user_id = 11;
  google.protobuf.Timestamp occurred_at = 12;
}

// finance.transaction.updated. Both sides are carried because a consumer maintaining its own
// totals has to subtract the old values before adding the new ones.
message TransactionUpdatedEvent {
  string family_id = 1;
  string transaction_id = 2;
  Money previous_amount = 3;
  string previous_category_id = 4;
  string previous_member_id = 5;
  string previous_occurred_on = 6;
  Money amount = 7;
  string category_id = 8;
  string member_id = 9;
  string occurred_on = 10;
  string actor_user_id = 11;
  google.protobuf.Timestamp occurred_at = 12;
}

// finance.transaction.deleted
message TransactionDeletedEvent {
  string family_id = 1;
  string transaction_id = 2;
  string account_id = 3;
  string category_id = 4;
  Money amount = 5;
  string occurred_on = 6;
  string actor_user_id = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

// finance.transfer.created — kept separate from transaction.created so a consumer computing
// spend never has to special-case a subject it already subscribed to.
message TransferCreatedEvent {
  string family_id = 1;
  string transaction_id = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  Money amount = 5;
  Money received_amount = 6;
  string occurred_on = 7;
  string actor_user_id = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

// finance.account.created
message AccountCreatedEvent {
  string family_id = 1;
  string account_id = 2;
  AccountVisibility visibility = 3;
  string owner_member_id = 4;
  AccountKind kind = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

// finance.account.updated
message AccountUpdatedEvent {
  string family_id = 1;
  string account_id = 2;
  AccountVisibility visibility = 3;
  bool archived = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// finance.budget.created
message BudgetCreatedEvent {
  string family_id = 1;
  string budget_id = 2;
  BudgetTargetKind target_kind = 3;
  string group_id = 4;
  string category_id = 5;
  Money limit = 6;
  BudgetPeriod period = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

// finance.budget.updated
message BudgetUpdatedEvent {
  string family_id = 1;
  string budget_id = 2;
  Money limit = 3;
  BudgetPeriod period = 4;
  bool archived = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

// finance.budget.exceeded — the notifications service is the consumer behind the household
// screen's overspend toggle.
message BudgetExceededEvent {
  string family_id = 1;
  string budget_id = 2;
  BudgetTargetKind target_kind = 3;
  string group_id = 4;
  string category_id = 5;
  Money limit = 6;
  Money spent = 7;
  double share = 8;
  DateRange window = 9;
  string triggering_transaction_id = 10;
  string member_id = 11;
  google.protobuf.Timestamp occurred_at = 12;
}

// finance.budget.recovered — an edit or a delete can pull a budget back under its limit.
// Without this, a sent overspend alert could never be retracted and the same window would
// alert again on the next breach.
message BudgetRecoveredEvent {
  string family_id = 1;
  string budget_id = 2;
  DateRange window = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// finance.template.used — drives usage_count, chip ordering and widget refresh without a
// write path through the transaction consumer.
message TemplateUsedEvent {
  string family_id = 1;
  string template_id = 2;
  string owner_user_id = 3;
  string transaction_id = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// finance.recurring.due
message RecurringDueEvent {
  string family_id = 1;
  string recurring_id = 2;
  string name = 3;
  Money amount = 4;
  string due_on = 5;
  string member_id = 6;
  bool auto_post = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

// finance.recurring.posted
message RecurringPostedEvent {
  string family_id = 1;
  string recurring_id = 2;
  string transaction_id = 3;
  string due_on = 4;
  string next_due_on = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

// finance.reminder.due
message ReminderDueEvent {
  string family_id = 1;
  string reminder_id = 2;
  string user_id = 3;
  ReminderKind kind = 4;
  string title = 5;
  google.protobuf.Timestamp due_at = 6;
  google.protobuf.Timestamp occurred_at = 7;
}
