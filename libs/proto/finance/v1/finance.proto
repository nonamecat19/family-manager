}

message UpdateAccountRequest {
  string account_id = 1;
  optional string name = 2;
  optional AccountKind kind = 3;
  optional AccountVisibility visibility = 4;
  optional string icon = 5;
  optional int32 color_step = 6;
  optional bool excluded_from_family_total = 7;
