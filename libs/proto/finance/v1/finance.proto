syntax = "proto3";

package finance.v1;

// go_package is set by buf managed mode (libs/proto/buf.gen.yaml) to
// github.com/nnc/family-manager/sdk/go/finance/v1 — do not set it here.

import "google/protobuf/timestamp.proto";

// FinanceService is the household ledger, rebuilt around the 11-screen design: accounts hold
// money (shared or private), a two-level category taxonomy classifies it, transactions are
// attributed to the member who spent rather than only to the user who typed, budgets attach to
// a group or a category, and every aggregate is asked for through the same Scope + Period pair
// so Home, Transactions, Charts and the home-screen widgets can never disagree.
//
// Identity is not duplicated here. families and members live in services/family (family.v1);
// this service takes family_id and user_id from the access token's claims and keeps a member
// read-model fed by `family.member.*` events. It never accepts a family_id in a request body
// and never joins across a service boundary.
//
// Privacy is enforced server-side, not by the client: a private account belongs to exactly one
// member, its balance never reaches another member's device, and other members' private
// accounts are collapsed to a count (HiddenPrivateSummary) before the response is written.
service FinanceService {
  // --- household & settings ------------------------------------------------
  // BootstrapHousehold seeds finance for a family that services/family has just created:
  // settings plus the default group/category taxonomy, in one transaction. Idempotent per
  // family — calling it twice returns the existing rows rather than a second taxonomy.
  rpc BootstrapHousehold(BootstrapHouseholdRequest) returns (BootstrapHouseholdResponse);
  // GetHouseholdOverview is the household screen in one round trip: balances, period spend,
  // the per-member cards, and the shared-resource counters.
  rpc GetHouseholdOverview(GetHouseholdOverviewRequest) returns (GetHouseholdOverviewResponse);
  rpc GetFinanceSettings(GetFinanceSettingsRequest) returns (GetFinanceSettingsResponse);
  rpc UpdateFinanceSettings(UpdateFinanceSettingsRequest) returns (UpdateFinanceSettingsResponse);
  // SetOverspendNotifications is its own RPC because it is a single switch on the household
  // screen; routing it through UpdateFinanceSettings would make an accidental currency change
  // one mistyped field away from a toggle.
  rpc SetOverspendNotifications(SetOverspendNotificationsRequest) returns (SetOverspendNotificationsResponse);
  // ListMembers reads the member projection maintained from family.v1 events, so the "who
  // spent" picker and the avatar chips render without a synchronous call to services/family.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  // --- accounts ------------------------------------------------------------
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  // ArchiveAccount hides an account that still has history. DeleteAccount is refused while
  // transactions reference it — a balance that silently loses its rows is a corrupt ledger.
  rpc ArchiveAccount(ArchiveAccountRequest) returns (ArchiveAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc ReorderAccounts(ReorderAccountsRequest) returns (ReorderAccountsResponse);
  // TransferBetweenAccounts writes both legs in one transaction so a transfer can never
  // half-commit, and is excluded from expense and income totals.
  rpc TransferBetweenAccounts(TransferBetweenAccountsRequest) returns (TransferBetweenAccountsResponse);

  // --- categories ----------------------------------------------------------
  // ListCategoryTree is the whole categories screen and the add-sheet picker: groups, their
  // categories, and each group's budget status.
  rpc ListCategoryTree(ListCategoryTreeRequest) returns (ListCategoryTreeResponse);
  rpc CreateCategoryGroup(CreateCategoryGroupRequest) returns (CreateCategoryGroupResponse);
  rpc UpdateCategoryGroup(UpdateCategoryGroupRequest) returns (UpdateCategoryGroupResponse);
  rpc DeleteCategoryGroup(DeleteCategoryGroupRequest) returns (DeleteCategoryGroupResponse);
  rpc ReorderCategoryGroups(ReorderCategoryGroupsRequest) returns (ReorderCategoryGroupsResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc MoveCategory(MoveCategoryRequest) returns (MoveCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc ReorderCategories(ReorderCategoriesRequest) returns (ReorderCategoriesResponse);

  // --- transactions --------------------------------------------------------
  // CreateTransaction returns the budgets it moved, so the app can repaint the Home bars and
  // raise an overspend toast without a refetch.
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc UpdateTransaction(UpdateTransactionRequest) returns (UpdateTransactionResponse);
  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteTransactionResponse);
  // ListTransactions is grouped into day sections server-side: the per-day subtotal and the
  // period total have to agree with the page boundary, and only the server knows both.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);

  // --- quick templates -----------------------------------------------------
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc ReorderTemplates(ReorderTemplatesRequest) returns (ReorderTemplatesResponse);
  // LogTemplate is one round trip from a home-screen widget that may have no app process
  // alive: it writes the transaction and returns the budgets it moved.
  rpc LogTemplate(LogTemplateRequest) returns (LogTemplateResponse);

  // --- budgets -------------------------------------------------------------
  rpc ListBudgets(ListBudgetsRequest) returns (ListBudgetsResponse);
  rpc CreateBudget(CreateBudgetRequest) returns (CreateBudgetResponse);
  rpc UpdateBudget(UpdateBudgetRequest) returns (UpdateBudgetResponse);
  rpc DeleteBudget(DeleteBudgetRequest) returns (DeleteBudgetResponse);

  // --- analytics -----------------------------------------------------------
  // GetHomeSummary is the home screen in a single call — headline, donut, group rows with
  // their budget bars, member chips and template chips all move together when the scope or
  // the period changes, so they are fetched together.
  rpc GetHomeSummary(GetHomeSummaryRequest) returns (GetHomeSummaryResponse);
  rpc GetGroupBreakdown(GetGroupBreakdownRequest) returns (GetGroupBreakdownResponse);
  rpc GetMemberBreakdown(GetMemberBreakdownRequest) returns (GetMemberBreakdownResponse);
  // GetSpendingSeries backs the stacked bar chart. Stacking is a parameter rather than a
  // second RPC so flipping the total/expense/income tab is one request.
  rpc GetSpendingSeries(GetSpendingSeriesRequest) returns (GetSpendingSeriesResponse);
  // ListInsights is computed server-side so the same wording reaches app, widget and
  // notification instead of three nearly identical sentences.
  rpc ListInsights(ListInsightsRequest) returns (ListInsightsResponse);

  // --- recurring payments --------------------------------------------------
  rpc ListRecurringPayments(ListRecurringPaymentsRequest) returns (ListRecurringPaymentsResponse);
  rpc CreateRecurringPayment(CreateRecurringPaymentRequest) returns (CreateRecurringPaymentResponse);
  rpc UpdateRecurringPayment(UpdateRecurringPaymentRequest) returns (UpdateRecurringPaymentResponse);
  rpc DeleteRecurringPayment(DeleteRecurringPaymentRequest) returns (DeleteRecurringPaymentResponse);
  // Confirm-or-skip is the default for a payment that may not have actually happened; a
  // payment with auto_post set writes its occurrence without this step.
  rpc PostRecurringOccurrence(PostRecurringOccurrenceRequest) returns (PostRecurringOccurrenceResponse);
  rpc SkipRecurringOccurrence(SkipRecurringOccurrenceRequest) returns (SkipRecurringOccurrenceResponse);

  // --- reminders -----------------------------------------------------------
  // finance stores the subscription; delivery is services/notifications' job, driven by the
  // events below.
  rpc ListReminders(ListRemindersRequest) returns (ListRemindersResponse);
  rpc UpsertReminder(UpsertReminderRequest) returns (UpsertReminderResponse);
  rpc DeleteReminder(DeleteReminderRequest) returns (DeleteReminderResponse);

  // --- widgets -------------------------------------------------------------
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsResponse);
  rpc AddWidget(AddWidgetRequest) returns (AddWidgetResponse);
  rpc UpdateWidget(UpdateWidgetRequest) returns (UpdateWidgetResponse);
  rpc RemoveWidget(RemoveWidgetRequest) returns (RemoveWidgetResponse);
  // GetWidgetData refreshes every placed widget in one request: one call per widget would
  // make the Android update pass N round trips on a cold process.
  rpc GetWidgetData(GetWidgetDataRequest) returns (GetWidgetDataResponse);
}

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// AccountKind drives the icon, and which accounts feed the shared headline: SAVINGS is
// reported on its own savings line, DEBT counts toward the headline because money owed is
// money you do not have.
enum AccountKind {
  ACCOUNT_KIND_UNSPECIFIED = 0;
  ACCOUNT_KIND_CASH = 1;
  ACCOUNT_KIND_CARD = 2;
  ACCOUNT_KIND_BANK = 3;
  ACCOUNT_KIND_SAVINGS = 4;
  ACCOUNT_KIND_CRYPTO = 5;
  ACCOUNT_KIND_DEBT = 6;
}

// AccountVisibility is the privacy boundary. PRIVATE means owned by exactly one member: the
// balance is excluded from the family headline and never serialised to anyone else.
enum AccountVisibility {
  ACCOUNT_VISIBILITY_UNSPECIFIED = 0;
  ACCOUNT_VISIBILITY_SHARED = 1;
  ACCOUNT_VISIBILITY_PRIVATE = 2;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_EXPENSE = 1;
  TRANSACTION_TYPE_INCOME = 2;
  // TRANSFER moves money between two accounts of the same household and is excluded from
  // both income and expense totals.
  TRANSACTION_TYPE_TRANSFER = 3;
}

// TransactionKind is the expense/income tab as a filter. UNSPECIFIED means "both", which is
// the chart screen's ЗАГАЛЬНЕ tab — there is no separate TOTAL member, because "no filter" and
// "total" are the same request.
enum TransactionKind {
  TRANSACTION_KIND_UNSPECIFIED = 0;
  TRANSACTION_KIND_EXPENSE = 1;
  TRANSACTION_KIND_INCOME = 2;
}

// ScopeKind is the total switcher: the whole family, one member, or one account. Every
// aggregate RPC takes it, which is what keeps the screens consistent with each other.
enum ScopeKind {
  SCOPE_KIND_UNSPECIFIED = 0;
  SCOPE_KIND_FAMILY = 1;
  SCOPE_KIND_MEMBER = 2;
  SCOPE_KIND_ACCOUNT = 3;
}

// PeriodGranularity is the день/тиждень/місяць/рік/період selector. The server resolves the
// window edges so the app and a home-screen widget can never disagree about where a month ends.
enum PeriodGranularity {
  PERIOD_GRANULARITY_UNSPECIFIED = 0;
  PERIOD_GRANULARITY_DAY = 1;
  PERIOD_GRANULARITY_WEEK = 2;
  PERIOD_GRANULARITY_MONTH = 3;
  PERIOD_GRANULARITY_YEAR = 4;
  // CUSTOM takes the explicit range on Period.range and ignores the anchor.
  PERIOD_GRANULARITY_CUSTOM = 5;
}

enum BudgetPeriod {
  BUDGET_PERIOD_UNSPECIFIED = 0;
  BUDGET_PERIOD_WEEK = 1;
  BUDGET_PERIOD_MONTH = 2;
  BUDGET_PERIOD_YEAR = 3;
}

// BudgetTargetKind says which of a budget's two possible attach points is set. Exactly one of
// group_id / category_id is populated; this enum saves every caller from re-deriving that.
enum BudgetTargetKind {
  BUDGET_TARGET_KIND_UNSPECIFIED = 0;
  BUDGET_TARGET_KIND_GROUP = 1;
  BUDGET_TARGET_KIND_CATEGORY = 2;
}

// BudgetTargetFilter narrows ListBudgets. UNSPECIFIED is every budget, which is what the
// household counter needs.
enum BudgetTargetFilter {
  BUDGET_TARGET_FILTER_UNSPECIFIED = 0;
  BUDGET_TARGET_FILTER_GROUP = 1;
  BUDGET_TARGET_FILTER_CATEGORY = 2;
}

// SeriesStacking chooses the segments inside each bar of the chart screen's series.
enum SeriesStacking {
  SERIES_STACKING_UNSPECIFIED = 0;
  SERIES_STACKING_NONE = 1;
  SERIES_STACKING_MEMBER = 2;
  SERIES_STACKING_GROUP = 3;
}

enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_OWNER = 1;
  MEMBER_ROLE_MEMBER = 2;
}

// MemberStatus mirrors the family.v1 projection: PENDING is an invited member who has not
// accepted yet, and who therefore has no transactions.
enum MemberStatus {
  MEMBER_STATUS_UNSPECIFIED = 0;
  MEMBER_STATUS_ACTIVE = 1;
  MEMBER_STATUS_PENDING = 2;
}

// Weekday anchors the household's budget weeks. The design's week does not necessarily start
// where the device locale thinks it does, so it is stored, not inferred.
enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

enum RecurrenceUnit {
  RECURRENCE_UNIT_UNSPECIFIED = 0;
  RECURRENCE_UNIT_DAY = 1;
  RECURRENCE_UNIT_WEEK = 2;
  RECURRENCE_UNIT_MONTH = 3;
  RECURRENCE_UNIT_YEAR = 4;
}

enum ReminderKind {
  REMINDER_KIND_UNSPECIFIED = 0;
  REMINDER_KIND_BUDGET_EXCEEDED = 1;
  REMINDER_KIND_RECURRING_DUE = 2;
  REMINDER_KIND_CUSTOM = 3;
}

enum WidgetType {
  WIDGET_TYPE_UNSPECIFIED = 0;
  WIDGET_TYPE_QUICK_ADD = 1;
  WIDGET_TYPE_MONTH = 2;
  WIDGET_TYPE_CATEGORY = 3;
  WIDGET_TYPE_BUDGETS_AND_FAMILY = 4;
  WIDGET_TYPE_RECENT_TRANSACTIONS = 5;
  WIDGET_TYPE_ACCOUNTS = 6;
}

// WidgetSize is the Android home-screen cell footprint, named rather than a pair of ints so
// the gallery badge and the layout code cannot drift apart.
enum WidgetSize {
  WIDGET_SIZE_UNSPECIFIED = 0;
  WIDGET_SIZE_4X2 = 1;
  WIDGET_SIZE_2X2 = 2;
  WIDGET_SIZE_2X1 = 3;
  WIDGET_SIZE_4X3 = 4;
  WIDGET_SIZE_4X1 = 5;
}

// InsightKind lets the app pick an icon and an accent without parsing the sentence.
enum InsightKind {
  INSIGHT_KIND_UNSPECIFIED = 0;
  INSIGHT_KIND_SPEND_SPIKE = 1;
  INSIGHT_KIND_SPEND_DROP = 2;
  INSIGHT_KIND_BUDGET_EXCEEDED = 3;
  INSIGHT_KIND_NEW_MERCHANT = 4;
}

// ---------------------------------------------------------------------------
// Value objects
// ---------------------------------------------------------------------------

// Money is a minor-unit integer plus its ISO 4217 code. Floating point never touches money in
// this repo: 10.10 is {amount_minor: 1010, currency_code: "EUR"}. packages/api converts the
// int64 to a plain JS number exactly once, at its wire boundary.
message Money {
  int64 amount_minor = 1;
  string currency_code = 2;
}

// DateRange is inclusive on both ends, as calendar dates (YYYY-MM-DD) in the household's
// timezone — a spending report is a calendar question, not an instant one.
message DateRange {
  string from = 1;
  string to = 2;
}

// Period is the shared window request. anchor is any date inside the wanted window
// (YYYY-MM-DD); range is read only when granularity is CUSTOM.
message Period {
  PeriodGranularity granularity = 1;
  string anchor = 2;
  DateRange range = 3;
}

// Scope is the "Родина ▾" switcher. member_id is read only for MEMBER, account_id only for
// ACCOUNT; an empty Scope means the whole family.
message Scope {
  ScopeKind kind = 1;
  string member_id = 2;
  string account_id = 3;
}

// ---------------------------------------------------------------------------
// Entities
// ---------------------------------------------------------------------------

// HouseholdFinanceSettings is everything finance owns about a household. The name, the
// members and the invitations belong to family.v1 and are deliberately absent here.
message HouseholdFinanceSettings {
  string family_id = 1;
  string base_currency_code = 2;
  // timezone is an IANA name ("Europe/Kyiv"); it decides where a day, and therefore a day
  // section and a budget window, ends.
  string timezone = 3;
  Weekday week_starts_on = 4;
  bool overspend_notifications_enabled = 5;
  // pin_lock_enabled is synced rather than device-local because the household agrees that
  // private balances are covered by a lock, and a second device must honour that.
  bool pin_lock_enabled = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Member is the read-model projected from family.v1's member events, kept so the pickers,
// avatars and per-member aggregates render without a synchronous cross-service call.
message Member {
  string user_id = 1;
  string family_id = 2;
  string display_name = 3;
  // initial is the single grapheme drawn in the avatar chip; the server derives it so every
  // surface (app, widget) shows the same letter.
  string initial = 4;
  // avatar_color_step indexes the shared accent ramp (0..7) rather than carrying a hex — the
  // design rejects per-entity random hues.
  int32 avatar_color_step = 5;
  MemberRole role = 6;
  MemberStatus status = 7;
  string email = 8;
  google.protobuf.Timestamp joined_at = 9;
}

message Account {
  string id = 1;
  string family_id = 2;
  string name = 3;
  AccountKind kind = 4;
  AccountVisibility visibility = 5;
  // owner_member_id is required for PRIVATE and empty for SHARED. A private account may only
  // ever be created for the caller.
  string owner_member_id = 6;
  string currency_code = 7;
  Money opening_balance = 8;
  // balance is derived from opening_balance plus every transaction leg; a client never
  // writes it, and a stored total would drift.
  Money balance = 9;
  string icon = 10;
  int32 color_step = 11;
  // excluded_from_family_total is true for private accounts and for anything the household
  // has deliberately taken out of the headline (a savings pot being held for someone else).
  bool excluded_from_family_total = 12;
  bool archived = 13;
  int32 sort_order = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

// HiddenPrivateSummary is all another member's private accounts ever become on the wire: a
// count. The row is inert in the UI and carries no balance to leak.
message HiddenPrivateSummary {
  string member_id = 1;
  string member_display_name = 2;
  int32 account_count = 3;
}

// CategoryGroup is the top level of the two-level taxonomy that replaced the flat icon grid.
message CategoryGroup {
  string id = 1;
  string family_id = 2;
  string name = 3;
  TransactionKind kind = 4;
  string icon = 5;
  // color_step indexes the accent ramp (0..7). Not a hex string: the design explicitly
  // rejects per-category random hues, and a ramp index survives a theme change.
  int32 color_step = 6;
  int32 sort_order = 7;
  bool archived = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// Category always belongs to exactly one group — there are no orphan roots, which is what
// replaced the old self-referencing parent tree. Colour is inherited from the group; only the
// icon varies per category.
message Category {
  string id = 1;
  string family_id = 2;
  string group_id = 3;
  string name = 4;
  TransactionKind kind = 5;
  string icon = 6;
  int32 sort_order = 7;
  bool archived = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// Budget attaches to either a group or a category, never both. The window rolls from
// start_on, so a household that budgets from the 5th is not forced onto calendar months.
message Budget {
  string id = 1;
  string family_id = 2;
  BudgetTargetKind target_kind = 3;
  string group_id = 4;
  string category_id = 5;
  Money limit = 6;
  BudgetPeriod period = 7;
  string start_on = 8;
  // member_id narrows a budget to one member; empty means the whole household, which is the
  // only form the current screens draw.
  string member_id = 9;
  bool notify_on_exceed = 10;
  bool archived = 11;
  int32 sort_order = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// BudgetStatus is derived, never stored — a persisted total drifts the moment a transaction
// is edited. share is spent/limit as a ratio, and may exceed 1.0: the design draws 256% by
// clamping the bar and switching the colour, which it cannot do if the server clamps first.
message BudgetStatus {
  Budget budget = 1;
  DateRange window = 2;
  Money spent = 3;
  // remaining goes negative once the limit is passed.
  Money remaining = 4;
  double share = 5;
  bool exceeded = 6;
  int32 days_remaining = 7;
}

message Transaction {
  string id = 1;
  string family_id = 2;
  TransactionType type = 3;
  string account_id = 4;
  // counter_account_id is set only on a TRANSFER: the account the money landed in.
  string counter_account_id = 5;
  string category_id = 6;
  string group_id = 7;
  // amount is always positive; the sign is the type's job, so a report never has to guess
  // whether a negative expense is a refund or a data-entry slip.
  Money amount = 8;
  // received_amount is set only on a cross-currency transfer: what arrived, in the
  // destination currency.
  Money received_amount = 9;
  string note = 10;
  // merchant is a free label ("jetbrains"), not a foreign key — a merchant registry is a
  // different product.
  string merchant = 11;
  string occurred_on = 12;
  // member_id is who spent. It is deliberately distinct from created_by_user_id (who typed
  // it) and from the account's owner: collapsing the three loses the per-member split.
  string member_id = 13;
  string created_by_user_id = 14;
  // template_id is provenance, and drives the "шаблон" badge on the feed row.
  string template_id = 15;
  string recurring_id = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

// QuickTemplate is a per-member quick-log button: tap to write it immediately, long-press to
// open the add sheet prefilled. Templates are private to their owner.
message QuickTemplate {
  string id = 1;
  string family_id = 2;
  string owner_user_id = 3;
  string label = 4;
  string icon = 5;
  Money amount = 6;
  TransactionType type = 7;
  string category_id = 8;
  string account_id = 9;
  // member_id defaults to the owner, so a template can still log on someone else's behalf.
  string member_id = 10;
  int32 sort_order = 11;
  int32 usage_count = 12;
  google.protobuf.Timestamp last_used_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// Cadence is a deliberately small recurrence model — every N days/weeks/months/years, with an
// optional day anchor. Full rrule expressiveness is not needed for a rent payment and would
// have to be reimplemented in the widget.
message Cadence {
  int32 interval = 1;
  RecurrenceUnit unit = 2;
  // day_of_month is 1..31 for MONTH/YEAR cadences; 0 means "same day as next_due_on". A 31
  // in a 30-day month clamps to the last day.
  int32 day_of_month = 3;
  Weekday day_of_week = 4;
}

message RecurringPayment {
  string id = 1;
  string family_id = 2;
  string name = 3;
  Money amount = 4;
  TransactionType type = 5;
  string category_id = 6;
  string account_id = 7;
  string member_id = 8;
  Cadence cadence = 9;
  string next_due_on = 10;
  string end_on = 11;
  // auto_post writes the transaction on the due date instead of asking. Off by default: a
  // payment that may not have happened must not invent a row.
  bool auto_post = 12;
  bool active = 13;
  string last_posted_on = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message RecurringPaymentStatus {
  RecurringPayment payment = 1;
  string next_due_on = 2;
  bool overdue = 3;
  Transaction last_posted = 4;
}

// Reminder is the subscription, not the push. services/notifications consumes the events
// below and delivers; finance only records what someone asked to be told about.
message Reminder {
  string id = 1;
  string family_id = 2;
  string user_id = 3;
  ReminderKind kind = 4;
  string title = 5;
  google.protobuf.Timestamp due_at = 6;
  Cadence repeat = 7;
  bool enabled = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// WidgetInstance is one placed home-screen widget. Each binds to a member or to the whole
// family, so two people can place the same type and see their own numbers.
message WidgetInstance {
  string id = 1;
  string family_id = 2;
  string user_id = 3;
  WidgetType type = 4;
  WidgetSize size = 5;
  Scope scope = 6;
  // target_ref is the type's subject: a category id, a group id, or empty. Account widgets
  // use target_account_ids instead.
  string target_ref = 7;
  repeated string target_account_ids = 8;
  int32 sort_order = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// ---------------------------------------------------------------------------
// Aggregate fragments — shared shapes used by the analytics responses
// ---------------------------------------------------------------------------

message MemberSpending {
  Member member = 1;
  Money spent = 2;
  double share = 3;
  int32 transaction_count = 4;
  // private_account_count is the only fact about another member's private accounts that
  // crosses the wire.
  int32 private_account_count = 5;
}

message MemberAmount {
  string member_id = 1;
  Money amount = 2;
}

message MemberChip {
  string member_id = 1;
  string display_name = 2;
  string initial = 3;
  int32 avatar_color_step = 4;
}

message DonutSlice {
  string group_id = 1;
  string name = 2;
  string icon = 3;
  int32 color_step = 4;
  Money amount = 5;
  double share = 6;
}

message CategorySlice {
  string category_id = 1;
  string name = 2;
  string icon = 3;
  Money amount = 4;
  double share = 5;
}

// GroupRow is a Home group row: either a budget bar or the "N категорій · share%" caption,
// which is why budget is optional rather than a zeroed BudgetStatus.
message GroupRow {
  string group_id = 1;
  string name = 2;
  string icon = 3;
  int32 color_step = 4;
  Money amount = 5;
  double share = 6;
  int32 category_count = 7;
  BudgetStatus budget = 8;
  // contributor_member_ids is who spent in this group this period, which is what the
  // "· Сергій" caption reports — not an ownership claim on the group.
  repeated string contributor_member_ids = 9;
}

message GroupMemberSplit {
  string group_id = 1;
  string name = 2;
  string icon = 3;
  int32 color_step = 4;
  Money total = 5;
  repeated MemberAmount members = 6;
}

// Insight is a sentence the server composed, so app, widget and notification say the same
// thing. current/previous/ratio are carried alongside so the app can render the numbers in
// its own typography instead of parsing the body.
message Insight {
  string id = 1;
  InsightKind kind = 2;
  string icon = 3;
  string title = 4;
  string body = 5;
  string subject_member_id = 6;
  string subject_group_id = 7;
  Money current = 8;
  Money previous = 9;
  double ratio = 10;
}

// DaySection groups the transaction feed. The subtotal is computed server-side with the same
// window as the page, so scrolling can never produce a total that disagrees with the header.
message DaySection {
  string date = 1;
  // weekday_label is localized by the server for the "29 серпня, сб" header.
  string weekday_label = 2;
  Money day_total = 3;
  repeated Transaction transactions = 4;
}

// GroupNode is one row of the categories screen: a group, its categories, and its budget.
message GroupNode {
  CategoryGroup group = 1;
  repeated Category categories = 2;
  BudgetStatus budget = 3;
  int32 category_count = 4;
}

