syntax = "proto3";

package finance.v1;


import "google/protobuf/timestamp.proto";

service FinanceService {
  rpc BootstrapHousehold(BootstrapHouseholdRequest) returns (BootstrapHouseholdResponse);
  rpc GetHouseholdOverview(GetHouseholdOverviewRequest) returns (GetHouseholdOverviewResponse);
  rpc GetFinanceSettings(GetFinanceSettingsRequest) returns (GetFinanceSettingsResponse);
  rpc UpdateFinanceSettings(UpdateFinanceSettingsRequest) returns (UpdateFinanceSettingsResponse);
  rpc SetOverspendNotifications(SetOverspendNotificationsRequest) returns (SetOverspendNotificationsResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc ArchiveAccount(ArchiveAccountRequest) returns (ArchiveAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc ReorderAccounts(ReorderAccountsRequest) returns (ReorderAccountsResponse);
  rpc TransferBetweenAccounts(TransferBetweenAccountsRequest) returns (TransferBetweenAccountsResponse);

  rpc ListCategoryTree(ListCategoryTreeRequest) returns (ListCategoryTreeResponse);
  rpc CreateCategoryGroup(CreateCategoryGroupRequest) returns (CreateCategoryGroupResponse);
  rpc UpdateCategoryGroup(UpdateCategoryGroupRequest) returns (UpdateCategoryGroupResponse);
  rpc DeleteCategoryGroup(DeleteCategoryGroupRequest) returns (DeleteCategoryGroupResponse);
  rpc ReorderCategoryGroups(ReorderCategoryGroupsRequest) returns (ReorderCategoryGroupsResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc MoveCategory(MoveCategoryRequest) returns (MoveCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc ReorderCategories(ReorderCategoriesRequest) returns (ReorderCategoriesResponse);

  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc UpdateTransaction(UpdateTransactionRequest) returns (UpdateTransactionResponse);
  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteTransactionResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);

  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc ReorderTemplates(ReorderTemplatesRequest) returns (ReorderTemplatesResponse);
  rpc LogTemplate(LogTemplateRequest) returns (LogTemplateResponse);

  rpc ListBudgets(ListBudgetsRequest) returns (ListBudgetsResponse);
  rpc CreateBudget(CreateBudgetRequest) returns (CreateBudgetResponse);
  rpc UpdateBudget(UpdateBudgetRequest) returns (UpdateBudgetResponse);
  rpc DeleteBudget(DeleteBudgetRequest) returns (DeleteBudgetResponse);

  rpc GetHomeSummary(GetHomeSummaryRequest) returns (GetHomeSummaryResponse);
  rpc GetGroupBreakdown(GetGroupBreakdownRequest) returns (GetGroupBreakdownResponse);
  rpc GetMemberBreakdown(GetMemberBreakdownRequest) returns (GetMemberBreakdownResponse);
  rpc GetSpendingSeries(GetSpendingSeriesRequest) returns (GetSpendingSeriesResponse);
  rpc ListInsights(ListInsightsRequest) returns (ListInsightsResponse);

  rpc ListRecurringPayments(ListRecurringPaymentsRequest) returns (ListRecurringPaymentsResponse);
  rpc CreateRecurringPayment(CreateRecurringPaymentRequest) returns (CreateRecurringPaymentResponse);
  rpc UpdateRecurringPayment(UpdateRecurringPaymentRequest) returns (UpdateRecurringPaymentResponse);
  rpc DeleteRecurringPayment(DeleteRecurringPaymentRequest) returns (DeleteRecurringPaymentResponse);
  rpc PostRecurringOccurrence(PostRecurringOccurrenceRequest) returns (PostRecurringOccurrenceResponse);
  rpc SkipRecurringOccurrence(SkipRecurringOccurrenceRequest) returns (SkipRecurringOccurrenceResponse);

  rpc ListReminders(ListRemindersRequest) returns (ListRemindersResponse);
  rpc UpsertReminder(UpsertReminderRequest) returns (UpsertReminderResponse);
  rpc DeleteReminder(DeleteReminderRequest) returns (DeleteReminderResponse);

  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsResponse);
  rpc AddWidget(AddWidgetRequest) returns (AddWidgetResponse);
  rpc UpdateWidget(UpdateWidgetRequest) returns (UpdateWidgetResponse);
  rpc RemoveWidget(RemoveWidgetRequest) returns (RemoveWidgetResponse);
  rpc GetWidgetData(GetWidgetDataRequest) returns (GetWidgetDataResponse);
}


enum AccountKind {
  ACCOUNT_KIND_UNSPECIFIED = 0;
  ACCOUNT_KIND_CASH = 1;
  ACCOUNT_KIND_CARD = 2;
  ACCOUNT_KIND_BANK = 3;
  ACCOUNT_KIND_SAVINGS = 4;
  ACCOUNT_KIND_CRYPTO = 5;
  ACCOUNT_KIND_DEBT = 6;
}

enum AccountVisibility {
  ACCOUNT_VISIBILITY_UNSPECIFIED = 0;
  ACCOUNT_VISIBILITY_SHARED = 1;
  ACCOUNT_VISIBILITY_PRIVATE = 2;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_EXPENSE = 1;
  TRANSACTION_TYPE_INCOME = 2;
  TRANSACTION_TYPE_TRANSFER = 3;
}

enum TransactionKind {
  TRANSACTION_KIND_UNSPECIFIED = 0;
  TRANSACTION_KIND_EXPENSE = 1;
  TRANSACTION_KIND_INCOME = 2;
}

enum ScopeKind {
  SCOPE_KIND_UNSPECIFIED = 0;
  SCOPE_KIND_FAMILY = 1;
  SCOPE_KIND_MEMBER = 2;
  SCOPE_KIND_ACCOUNT = 3;
}

enum PeriodGranularity {
  PERIOD_GRANULARITY_UNSPECIFIED = 0;
  PERIOD_GRANULARITY_DAY = 1;
  PERIOD_GRANULARITY_WEEK = 2;
  PERIOD_GRANULARITY_MONTH = 3;
  PERIOD_GRANULARITY_YEAR = 4;
  PERIOD_GRANULARITY_CUSTOM = 5;
}

enum BudgetPeriod {
  BUDGET_PERIOD_UNSPECIFIED = 0;
  BUDGET_PERIOD_WEEK = 1;
  BUDGET_PERIOD_MONTH = 2;
  BUDGET_PERIOD_YEAR = 3;
}

enum BudgetTargetKind {
  BUDGET_TARGET_KIND_UNSPECIFIED = 0;
  BUDGET_TARGET_KIND_GROUP = 1;
  BUDGET_TARGET_KIND_CATEGORY = 2;
}

enum BudgetTargetFilter {
  BUDGET_TARGET_FILTER_UNSPECIFIED = 0;
  BUDGET_TARGET_FILTER_GROUP = 1;
  BUDGET_TARGET_FILTER_CATEGORY = 2;
}

enum SeriesStacking {
  SERIES_STACKING_UNSPECIFIED = 0;
  SERIES_STACKING_NONE = 1;
  SERIES_STACKING_MEMBER = 2;
  SERIES_STACKING_GROUP = 3;
}

enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_OWNER = 1;
  MEMBER_ROLE_MEMBER = 2;
}

enum MemberStatus {
  MEMBER_STATUS_UNSPECIFIED = 0;
  MEMBER_STATUS_ACTIVE = 1;
  MEMBER_STATUS_PENDING = 2;
}

enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

enum RecurrenceUnit {
  RECURRENCE_UNIT_UNSPECIFIED = 0;
  RECURRENCE_UNIT_DAY = 1;
  RECURRENCE_UNIT_WEEK = 2;
  RECURRENCE_UNIT_MONTH = 3;
  RECURRENCE_UNIT_YEAR = 4;
}

enum ReminderKind {
  REMINDER_KIND_UNSPECIFIED = 0;
  REMINDER_KIND_BUDGET_EXCEEDED = 1;
  REMINDER_KIND_RECURRING_DUE = 2;
  REMINDER_KIND_CUSTOM = 3;
}

enum WidgetType {
  WIDGET_TYPE_UNSPECIFIED = 0;
  WIDGET_TYPE_QUICK_ADD = 1;
  WIDGET_TYPE_MONTH = 2;
  WIDGET_TYPE_CATEGORY = 3;
  WIDGET_TYPE_BUDGETS_AND_FAMILY = 4;
  WIDGET_TYPE_RECENT_TRANSACTIONS = 5;
  WIDGET_TYPE_ACCOUNTS = 6;
}

enum WidgetSize {
  WIDGET_SIZE_UNSPECIFIED = 0;
  WIDGET_SIZE_4X2 = 1;
  WIDGET_SIZE_2X2 = 2;
  WIDGET_SIZE_2X1 = 3;
  WIDGET_SIZE_4X3 = 4;
  WIDGET_SIZE_4X1 = 5;
}

enum InsightKind {
  INSIGHT_KIND_UNSPECIFIED = 0;
  INSIGHT_KIND_SPEND_SPIKE = 1;
  INSIGHT_KIND_SPEND_DROP = 2;
  INSIGHT_KIND_BUDGET_EXCEEDED = 3;
  INSIGHT_KIND_NEW_MERCHANT = 4;
}


message Money {
  int64 amount_minor = 1;
  string currency_code = 2;
}

message DateRange {
  string from = 1;
  string to = 2;
}

message Period {
  PeriodGranularity granularity = 1;
  string anchor = 2;
  DateRange range = 3;
}

message Scope {
  ScopeKind kind = 1;
  string member_id = 2;
  string account_id = 3;
}


message HouseholdFinanceSettings {
  string family_id = 1;
  string base_currency_code = 2;
  string timezone = 3;
  Weekday week_starts_on = 4;
  bool overspend_notifications_enabled = 5;
  bool pin_lock_enabled = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Member {
  string user_id = 1;
  string family_id = 2;
  string display_name = 3;
  string initial = 4;
  int32 avatar_color_step = 5;
  MemberRole role = 6;
  MemberStatus status = 7;
  string email = 8;
  google.protobuf.Timestamp joined_at = 9;
}

message Account {
  string id = 1;
  string family_id = 2;
  string name = 3;
  AccountKind kind = 4;
  AccountVisibility visibility = 5;
  string owner_member_id = 6;
  string currency_code = 7;
  Money opening_balance = 8;
  Money balance = 9;
  string icon = 10;
  int32 color_step = 11;
  bool excluded_from_family_total = 12;
  bool archived = 13;
  int32 sort_order = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message HiddenPrivateSummary {
  string member_id = 1;
  string member_display_name = 2;
  int32 account_count = 3;
}

message CategoryGroup {
  string id = 1;
  string family_id = 2;
  string name = 3;
  TransactionKind kind = 4;
  string icon = 5;
  int32 color_step = 6;
  int32 sort_order = 7;
  bool archived = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message Category {
  string id = 1;
  string family_id = 2;
  string group_id = 3;
  string name = 4;
  TransactionKind kind = 5;
  string icon = 6;
  int32 sort_order = 7;
  bool archived = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message Budget {
  string id = 1;
  string family_id = 2;
  BudgetTargetKind target_kind = 3;
  string group_id = 4;
  string category_id = 5;
  Money limit = 6;
  BudgetPeriod period = 7;
  string start_on = 8;
  string member_id = 9;
  bool notify_on_exceed = 10;
  bool archived = 11;
  int32 sort_order = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message BudgetStatus {
  Budget budget = 1;
  DateRange window = 2;
  Money spent = 3;
  Money remaining = 4;
  double share = 5;
  bool exceeded = 6;
  int32 days_remaining = 7;
}

message Transaction {
  string id = 1;
  string family_id = 2;
  TransactionType type = 3;
  string account_id = 4;
  string counter_account_id = 5;
  string category_id = 6;
  string group_id = 7;
  Money amount = 8;
  Money received_amount = 9;
  string note = 10;
  string merchant = 11;
  string occurred_on = 12;
  string member_id = 13;
  string created_by_user_id = 14;
  string template_id = 15;
  string recurring_id = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message QuickTemplate {
  string id = 1;
  string family_id = 2;
  string owner_user_id = 3;
  string label = 4;
  string icon = 5;
  Money amount = 6;
  TransactionType type = 7;
  string category_id = 8;
  string account_id = 9;
  string member_id = 10;
  int32 sort_order = 11;
  int32 usage_count = 12;
  google.protobuf.Timestamp last_used_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message Cadence {
  int32 interval = 1;
  RecurrenceUnit unit = 2;
  int32 day_of_month = 3;
  Weekday day_of_week = 4;
}

message RecurringPayment {
  string id = 1;
  string family_id = 2;
  string name = 3;
  Money amount = 4;
  TransactionType type = 5;
  string category_id = 6;
  string account_id = 7;
  string member_id = 8;
  Cadence cadence = 9;
  string next_due_on = 10;
  string end_on = 11;
  bool auto_post = 12;
  bool active = 13;
  string last_posted_on = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message RecurringPaymentStatus {
  RecurringPayment payment = 1;
  string next_due_on = 2;
  bool overdue = 3;
  Transaction last_posted = 4;
}

message Reminder {
  string id = 1;
  string family_id = 2;
  string user_id = 3;
  ReminderKind kind = 4;
  string title = 5;
  google.protobuf.Timestamp due_at = 6;
  Cadence repeat = 7;
  bool enabled = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message WidgetInstance {
  string id = 1;
  string family_id = 2;
  string user_id = 3;
  WidgetType type = 4;
  WidgetSize size = 5;
  Scope scope = 6;
  string target_ref = 7;
  repeated string target_account_ids = 8;
  int32 sort_order = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}


message MemberSpending {
  Member member = 1;
  Money spent = 2;
  double share = 3;
  int32 transaction_count = 4;
  int32 private_account_count = 5;
}

message MemberAmount {
  string member_id = 1;
  Money amount = 2;
}

message MemberChip {
  string member_id = 1;
  string display_name = 2;
  string initial = 3;
  int32 avatar_color_step = 4;
}

message DonutSlice {
  string group_id = 1;
  string name = 2;
  string icon = 3;
  int32 color_step = 4;
  Money amount = 5;
  double share = 6;
}

message CategorySlice {
  string category_id = 1;
  string name = 2;
  string icon = 3;
  Money amount = 4;
  double share = 5;
}

message GroupRow {
  string group_id = 1;
  string name = 2;
  string icon = 3;
  int32 color_step = 4;
  Money amount = 5;
  double share = 6;
  int32 category_count = 7;
  BudgetStatus budget = 8;
  repeated string contributor_member_ids = 9;
}

message GroupMemberSplit {
  string group_id = 1;
  string name = 2;
  string icon = 3;
  int32 color_step = 4;
  Money total = 5;
  repeated MemberAmount members = 6;
}

message Insight {
  string id = 1;
  InsightKind kind = 2;
  string icon = 3;
  string title = 4;
  string body = 5;
  string subject_member_id = 6;
  string subject_group_id = 7;
  Money current = 8;
  Money previous = 9;
  double ratio = 10;
}

message DaySection {
  string date = 1;
  string weekday_label = 2;
  Money day_total = 3;
  repeated Transaction transactions = 4;
}

message GroupNode {
  CategoryGroup group = 1;
  repeated Category categories = 2;
  BudgetStatus budget = 3;
  int32 category_count = 4;
}


message BootstrapHouseholdRequest {
  string base_currency_code = 1;
  string timezone = 2;
  bool seed_default_taxonomy = 3;
  Weekday week_starts_on = 4;
}
message BootstrapHouseholdResponse {
  HouseholdFinanceSettings settings = 1;
  repeated CategoryGroup groups = 2;
  repeated Category categories = 3;
}

message GetHouseholdOverviewRequest {
  Period period = 1;
}
message GetHouseholdOverviewResponse {
  Money shared_balance = 1;
  Money savings_total = 2;
  Money period_expense = 3;
  repeated MemberSpending members = 4;
  int32 shared_account_count = 5;
  int32 group_budget_count = 6;
  bool overspend_notifications_enabled = 7;
}

message GetFinanceSettingsRequest {}
message GetFinanceSettingsResponse {
  HouseholdFinanceSettings settings = 1;
}

message UpdateFinanceSettingsRequest {
  optional string base_currency_code = 1;
  optional Weekday week_starts_on = 2;
  optional bool overspend_notifications_enabled = 3;
  optional bool pin_lock_enabled = 4;
  optional string timezone = 5;
}
message UpdateFinanceSettingsResponse {
  HouseholdFinanceSettings settings = 1;
}

message SetOverspendNotificationsRequest {
  bool enabled = 1;
}
message SetOverspendNotificationsResponse {
  bool enabled = 1;
}

message ListMembersRequest {
  bool include_pending = 1;
}
message ListMembersResponse {
  repeated Member members = 1;
}


message ListAccountsRequest {
  bool include_archived = 1;
}
message ListAccountsResponse {
  repeated Account shared = 1;
  repeated Account private_own = 2;
  repeated HiddenPrivateSummary hidden = 3;
  Money shared_balance = 4;
  Money savings_total = 5;
}

message GetAccountRequest {
  string account_id = 1;
}
message GetAccountResponse {
  Account account = 1;
}

message CreateAccountRequest {
  string name = 1;
  AccountKind kind = 2;
  AccountVisibility visibility = 3;
  string currency_code = 4;
  Money opening_balance = 5;
  string icon = 6;
  int32 color_step = 7;
  bool excluded_from_family_total = 8;
}
message CreateAccountResponse {
  Account account = 1;
}

message UpdateAccountRequest {
  string account_id = 1;
  optional string name = 2;
  optional AccountKind kind = 3;
  optional AccountVisibility visibility = 4;
  optional string icon = 5;
  optional int32 color_step = 6;
  optional bool excluded_from_family_total = 7;
  Money opening_balance = 8;
}
message UpdateAccountResponse {
  Account account = 1;
}

message ArchiveAccountRequest {
  string account_id = 1;
  bool archived = 2;
}
message ArchiveAccountResponse {
  Account account = 1;
}

message DeleteAccountRequest {
  string account_id = 1;
}
message DeleteAccountResponse {}

message ReorderAccountsRequest {
  repeated string account_ids_in_order = 1;
}
message ReorderAccountsResponse {}

message TransferBetweenAccountsRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  Money amount = 3;
  Money received_amount = 4;
  string occurred_on = 5;
  string note = 6;
  string member_id = 7;
}
message TransferBetweenAccountsResponse {
  Transaction transaction = 1;
}


message ListCategoryTreeRequest {
  TransactionKind kind = 1;
  bool include_archived = 2;
  string as_of = 3;
}
message ListCategoryTreeResponse {
  repeated GroupNode groups = 1;
}

message CreateCategoryGroupRequest {
  string name = 1;
  TransactionKind kind = 2;
  string icon = 3;
  int32 color_step = 4;
}
message CreateCategoryGroupResponse {
  CategoryGroup group = 1;
}

message UpdateCategoryGroupRequest {
  string group_id = 1;
  optional string name = 2;
  optional string icon = 3;
  optional int32 color_step = 4;
  optional bool archived = 5;
}
message UpdateCategoryGroupResponse {
  CategoryGroup group = 1;
}

message DeleteCategoryGroupRequest {
  string group_id = 1;
  string reassign_to_group_id = 2;
}
message DeleteCategoryGroupResponse {
  int32 moved_categories = 1;
}

message ReorderCategoryGroupsRequest {
  repeated string group_ids_in_order = 1;
}
message ReorderCategoryGroupsResponse {}

message CreateCategoryRequest {
  string group_id = 1;
  string name = 2;
  string icon = 3;
  TransactionKind kind = 4;
}
message CreateCategoryResponse {
  Category category = 1;
}

message UpdateCategoryRequest {
  string category_id = 1;
  optional string name = 2;
  optional string icon = 3;
  optional bool archived = 4;
}
message UpdateCategoryResponse {
  Category category = 1;
}

message MoveCategoryRequest {
  string category_id = 1;
  string target_group_id = 2;
}
message MoveCategoryResponse {
  Category category = 1;
}

message DeleteCategoryRequest {
  string category_id = 1;
  string reassign_to_category_id = 2;
}
message DeleteCategoryResponse {
  int32 moved_transactions = 1;
}

message ReorderCategoriesRequest {
  string group_id = 1;
  repeated string category_ids_in_order = 2;
}
message ReorderCategoriesResponse {}


message CreateTransactionRequest {
  TransactionType type = 1;
  string account_id = 2;
  string category_id = 3;
  Money amount = 4;
  string occurred_on = 5;
  string note = 6;
  string merchant = 7;
  string member_id = 8;
  string template_id = 9;
}
message CreateTransactionResponse {
  Transaction transaction = 1;
  repeated BudgetStatus affected_budgets = 2;
}

message GetTransactionRequest {
  string transaction_id = 1;
}
message GetTransactionResponse {
  Transaction transaction = 1;
}

message UpdateTransactionRequest {
  string transaction_id = 1;
  optional TransactionType type = 2;
  optional string account_id = 3;
  optional string category_id = 4;
  optional string occurred_on = 5;
  optional string note = 6;
  optional string merchant = 7;
  optional string member_id = 8;
  Money amount = 9;
}
message UpdateTransactionResponse {
  Transaction transaction = 1;
  repeated BudgetStatus affected_budgets = 2;
}

message DeleteTransactionRequest {
  string transaction_id = 1;
}
message DeleteTransactionResponse {
  repeated BudgetStatus affected_budgets = 1;
}

message ListTransactionsRequest {
  Scope scope = 1;
  Period period = 2;
  TransactionKind kind = 3;
  repeated string member_ids = 4;
  repeated string account_ids = 5;
  repeated string group_ids = 6;
  repeated string category_ids = 7;
  string query = 8;
  string cursor = 9;
  int32 page_size = 10;
}
message ListTransactionsResponse {
  repeated DaySection days = 1;
  Money period_total = 2;
  string next_cursor = 3;
}


message ListTemplatesRequest {
  string owner_user_id = 1;
}
message ListTemplatesResponse {
  repeated QuickTemplate templates = 1;
}

message CreateTemplateRequest {
  string label = 1;
  string icon = 2;
  Money amount = 3;
  TransactionType type = 4;
  string category_id = 5;
  string account_id = 6;
  string member_id = 7;
}
message CreateTemplateResponse {
  QuickTemplate template = 1;
}

message UpdateTemplateRequest {
  string template_id = 1;
  optional string label = 2;
  optional string icon = 3;
  optional string category_id = 4;
  optional string account_id = 5;
  optional string member_id = 6;
  Money amount = 7;
}
message UpdateTemplateResponse {
  QuickTemplate template = 1;
}

message DeleteTemplateRequest {
  string template_id = 1;
}
message DeleteTemplateResponse {}

message ReorderTemplatesRequest {
  repeated string template_ids_in_order = 1;
}
message ReorderTemplatesResponse {}

message LogTemplateRequest {
  string template_id = 1;
  string occurred_on = 2;
  Money amount_override = 3;
}
message LogTemplateResponse {
  Transaction transaction = 1;
  repeated BudgetStatus affected_budgets = 2;
}


message ListBudgetsRequest {
  string as_of = 1;
  BudgetTargetFilter target = 2;
  bool include_archived = 3;
}
message ListBudgetsResponse {
  repeated BudgetStatus budgets = 1;
  int32 within_limit_count = 2;
  int32 total_count = 3;
}

message CreateBudgetRequest {
  oneof target {
    string group_id = 1;
    string category_id = 2;
  }
  Money limit = 3;
  BudgetPeriod period = 4;
  string start_on = 5;
  string member_id = 6;
  bool notify_on_exceed = 7;
}
message CreateBudgetResponse {
  BudgetStatus budget = 1;
}

message UpdateBudgetRequest {
  string budget_id = 1;
  Money limit = 2;
  optional BudgetPeriod period = 3;
  optional string start_on = 4;
  optional bool notify_on_exceed = 5;
  optional bool archived = 6;
}
message UpdateBudgetResponse {
  BudgetStatus budget = 1;
}

message DeleteBudgetRequest {
  string budget_id = 1;
}
message DeleteBudgetResponse {}


message GetHomeSummaryRequest {
  Scope scope = 1;
  Period period = 2;
  TransactionKind kind = 3;
}
message GetHomeSummaryResponse {
  Money headline_balance = 1;
  Money period_total = 2;
  int32 group_count = 3;
  repeated DonutSlice slices = 4;
  repeated GroupRow groups = 5;
  repeated QuickTemplate templates = 6;
  repeated MemberChip members = 7;
  DateRange window = 8;
}

message GetGroupBreakdownRequest {
  string group_id = 1;
  Scope scope = 2;
  Period period = 3;
  TransactionKind kind = 4;
}
message GetGroupBreakdownResponse {
  CategoryGroup group = 1;
  Money total = 2;
