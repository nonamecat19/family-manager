# Run from this directory: `cd libs/proto && buf generate` (or `just proto`).
# Everything below is GENERATED output — never hand-edited. See docs/adr/0001-connectrpc.md.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/nnc/family-manager/sdk/go
plugins:
  # --- Go: messages + Connect handlers (also serve gRPC and gRPC-Web) ---
  - remote: buf.build/protocolbuffers/go
    out: ../../sdk/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../../sdk/go
    opt: paths=source_relative

  # --- TypeScript: protoc-gen-es v2 emits messages AND service descriptors;
  #     @connectrpc/connect builds the client with createClient(). No second plugin.
  - remote: buf.build/bufbuild/es
    out: ../../sdk/typescript/src
    opt:
      - target=ts
      - import_extension=js
