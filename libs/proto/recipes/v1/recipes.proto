syntax = "proto3";

package recipes.v1;


import "google/protobuf/timestamp.proto";

service RecipesService {
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc CreateSubcategory(CreateSubcategoryRequest) returns (CreateSubcategoryResponse);
  rpc ListSubcategories(ListSubcategoriesRequest) returns (ListSubcategoriesResponse);

  rpc CreateRecipe(CreateRecipeRequest) returns (CreateRecipeResponse);
  rpc GetRecipe(GetRecipeRequest) returns (GetRecipeResponse);
  rpc ListRecipes(ListRecipesRequest) returns (ListRecipesResponse);
  rpc UpdateRecipe(UpdateRecipeRequest) returns (UpdateRecipeResponse);
  rpc DeleteRecipe(DeleteRecipeRequest) returns (DeleteRecipeResponse);
  rpc UploadRecipeImage(UploadRecipeImageRequest) returns (UploadRecipeImageResponse);

  rpc ToggleFavorite(ToggleFavoriteRequest) returns (ToggleFavoriteResponse);
  rpc ListFavorites(ListFavoritesRequest) returns (ListFavoritesResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);

  rpc PlanMeal(PlanMealRequest) returns (PlanMealResponse);
  rpc ListMealPlan(ListMealPlanRequest) returns (ListMealPlanResponse);
  rpc RemoveMealPlanEntry(RemoveMealPlanEntryRequest) returns (RemoveMealPlanEntryResponse);
  rpc TotalIngredients(TotalIngredientsRequest) returns (TotalIngredientsResponse);
  rpc SumIngredients(SumIngredientsRequest) returns (SumIngredientsResponse);

  rpc RateRecipe(RateRecipeRequest) returns (RateRecipeResponse);
}

enum RecipeSort {
  RECIPE_SORT_UNSPECIFIED = 0;
  RECIPE_SORT_NEWEST = 1;
  RECIPE_SORT_TITLE = 2;
  RECIPE_SORT_RATING = 3;
  RECIPE_SORT_TIME = 4;
  RECIPE_SORT_FAVORITES = 5;
}

enum MealSlot {
  MEAL_SLOT_UNSPECIFIED = 0;
  MEAL_SLOT_BREAKFAST = 1;
  MEAL_SLOT_LUNCH = 2;
  MEAL_SLOT_DINNER = 3;
  MEAL_SLOT_SNACK = 4;
  MEAL_SLOT_DESSERT = 5;
}

message Category {
  string id = 1;
  string family_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
}

message Subcategory {
  string id = 1;
  string category_id = 2;
  string family_id = 3;
  string name = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Ingredient {
  string name = 1;
  string amount = 2;
  string unit = 3;
}

message Nutrition {
  int32 kcal = 1;
  float protein_g = 2;
  float fat_g = 3;
  float carbs_g = 4;
}

message Step {
  int32 position = 1;
  string instruction = 2;
  int32 duration_seconds = 3;
}

message Recipe {
  string id = 1;
  string family_id = 2;
  string title = 3;
  string description = 4;
  string category_id = 5;
  string subcategory_id = 6;
  int32 servings = 7;
  int32 prep_seconds = 8;
  int32 cook_seconds = 9;
  repeated Ingredient ingredients = 10;
  repeated Step steps = 11;
  string author_user_id = 12;
  int32 favorite_count = 13;
  int32 comment_count = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  string image_url = 17;
  string notes = 18;
  int32 rating = 19;
  Nutrition nutrition = 20;
}

message Comment {
  string id = 1;
  string recipe_id = 2;
  string user_id = 3;
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
}

message MealPlanEntry {
  string id = 1;
  string family_id = 2;
  string recipe_id = 3;
  string date = 4;
  MealSlot slot = 5;
  int32 servings = 6;
  google.protobuf.Timestamp created_at = 7;
}


message CreateCategoryRequest {
  string name = 1;
}
message CreateCategoryResponse {
  Category category = 1;
}
message ListCategoriesRequest {}
message ListCategoriesResponse {
  repeated Category categories = 1;
}
message CreateSubcategoryRequest {
  string category_id = 1;
  string name = 2;
}
message CreateSubcategoryResponse {
  Subcategory subcategory = 1;
}
message ListSubcategoriesRequest {
  string category_id = 1;
}
message ListSubcategoriesResponse {
  repeated Subcategory subcategories = 1;
}


message CreateRecipeRequest {
  string title = 1;
  string description = 2;
  string category_id = 3;
  string subcategory_id = 4;
  int32 servings = 5;
  int32 prep_seconds = 6;
  int32 cook_seconds = 7;
  repeated Ingredient ingredients = 8;
  repeated Step steps = 9;
  string notes = 10;
  int32 rating = 11;
  Nutrition nutrition = 12;
}
message CreateRecipeResponse {
  Recipe recipe = 1;
}
message GetRecipeRequest {
  string recipe_id = 1;
}
message GetRecipeResponse {
  Recipe recipe = 1;
}
message ListRecipesRequest {
  string category_id = 1;
  string subcategory_id = 2;
  bool favorite_only = 3;
  string search = 4;
  RecipeSort sort = 5;
  int32 min_rating = 6;
  int32 max_total_seconds = 7;
  string ingredient = 8;
}
message ListRecipesResponse {
  repeated Recipe recipes = 1;
}
message UpdateRecipeRequest {
  string recipe_id = 1;
  string title = 2;
  string description = 3;
  string category_id = 4;
  string subcategory_id = 5;
  int32 servings = 6;
  int32 prep_seconds = 7;
  int32 cook_seconds = 8;
  repeated Ingredient ingredients = 9;
  repeated Step steps = 10;
  string notes = 11;
  int32 rating = 12;
  Nutrition nutrition = 13;
}
message UpdateRecipeResponse {
  Recipe recipe = 1;
}
message DeleteRecipeRequest {
  string recipe_id = 1;
}
message DeleteRecipeResponse {}
message UploadRecipeImageRequest {
  string recipe_id = 1;
  bytes image_data = 2;
  string content_type = 3;
}
message UploadRecipeImageResponse {
  Recipe recipe = 1;
}


message ToggleFavoriteRequest {
  string recipe_id = 1;
}
message ToggleFavoriteResponse {
  bool is_favorite = 1;
}
message ListFavoritesRequest {}
message ListFavoritesResponse {
  repeated Recipe recipes = 1;
}
message AddCommentRequest {
  string recipe_id = 1;
  string body = 2;
}
message AddCommentResponse {
  Comment comment = 1;
}
message ListCommentsRequest {
  string recipe_id = 1;
}
message ListCommentsResponse {
  repeated Comment comments = 1;
}


message PlanMealRequest {
  string recipe_id = 1;
  string date = 2;
  MealSlot slot = 3;
  int32 servings = 4;
}
message PlanMealResponse {
  MealPlanEntry entry = 1;
}
message ListMealPlanRequest {
  string from_date = 1;
  string to_date = 2;
}
message ListMealPlanResponse {
  repeated MealPlanEntry entries = 1;
}
message RemoveMealPlanEntryRequest {
  string entry_id = 1;
}
message RemoveMealPlanEntryResponse {}

message TotalIngredientsRequest {
  string from_date = 1;
  string to_date = 2;
}
message TotalIngredientsResponse {
  repeated IngredientTotal totals = 1;
}
message IngredientTotal {
  string name = 1;
  string unit = 2;
  string total_amount = 3;
}

message SumIngredientsRequest {
  repeated RecipeQuantity items = 1;
}
message RecipeQuantity {
  string recipe_id = 1;
  int32 servings = 2;
}
message SumIngredientsResponse {
  repeated IngredientTotal totals = 1;
}

message RateRecipeRequest {
  string recipe_id = 1;
  int32 rating = 2;
}
message RateRecipeResponse {
  Recipe recipe = 1;
}

message RecipeCreatedEvent {
  string family_id = 1;
  string recipe_id = 2;
  string author_user_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
}
message RecipeUpdatedEvent {
  string family_id = 1;
  string recipe_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}
message RecipeDeletedEvent {
  string family_id = 1;
  string recipe_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}
message MealPlannedEvent {
  string family_id = 1;
  string entry_id = 2;
  string recipe_id = 3;
  string date = 4;
  MealSlot slot = 5;
  google.protobuf.Timestamp occurred_at = 6;
}
