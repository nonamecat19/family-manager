services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: ${NOTES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTES_DB_PASSWORD:-secret}
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${NOTES_DB_USER:-postgres} -d notes']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
