version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries/"
    schema: "internal/db/migrations/"
    gen:
      go:
        package: "db"
        out: "db/"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        # The handler depends on this interface, not on *Queries, so tests substitute a fake
        # store instead of standing up Postgres.
        emit_interface: true
