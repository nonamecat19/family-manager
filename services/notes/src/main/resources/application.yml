spring:
  application:
    name: notes-java

  datasource:
    url: ${NOTES_DB_URL:jdbc:postgresql://localhost:5432/notes}
    username: ${NOTES_DB_USER:postgres}
    password: ${NOTES_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.example.notesjava: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ${NOTES_DB_PASSWORD:secret}
  jpa:
    show-sql: true
logging:
  level:
    com.example.notesjava: DEBUG
    org.hibernate.SQL: DEBUG
