server:
  http2:
    enabled: true

spring:
  application:
    name: notes-java

  datasource:
    url: ${NOTES_DB_URL:jdbc:postgresql://localhost:5432/notes}
    username: ${NOTES_DB_USER:postgres}
    password: ${NOTES_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

notes:
  auth:
    jwk-set-uri: ${NOTES_JWKS_URL:http://auth:8080/.well-known/jwks.json}
    issuer: ${NOTES_ISSUER:}
    audience: ${NOTES_AUDIENCE:}
  storage:
    provider: ${NOTES_STORAGE_PROVIDER:minio}
    endpoint: ${NOTES_STORAGE_ENDPOINT:}
    access-key: ${NOTES_STORAGE_ACCESS_KEY:}
    secret-key: ${NOTES_STORAGE_SECRET_KEY:}
    use-ssl: ${NOTES_STORAGE_USE_SSL:false}
    bucket: ${NOTES_STORAGE_BUCKET:notes}
    public-url: ${NOTES_STORAGE_PUBLIC_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.example.notesjava: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ${NOTES_DB_PASSWORD:secret}
  jpa:
    show-sql: true
logging:
  level:
    com.example.notesjava: DEBUG
    org.hibernate.SQL: DEBUG
