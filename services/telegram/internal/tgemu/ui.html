<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram emulator</title>
<style>
:root{--bg:#0e1621;--panel:#17212b;--in:#182533;--out:#2b5278;--fg:#e6edf3;--muted:#7f91a4;--accent:#5eb5f7;--btn:#22303f}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100vh}
header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--panel)}
header label{color:var(--muted);font-size:13px}
input,select,button{font:inherit;color:var(--fg);background:var(--btn);border:1px solid #2c3b4a;border-radius:6px;padding:6px 8px}
input[type=number]{width:120px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:min(560px,85%);padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--out)}
.msg.bot{align-self:flex-start;background:var(--in)}
.meta{color:var(--muted);font-size:11px;margin-top:4px}
.kb{display:grid;gap:4px;margin-top:6px}
.kb .row{display:flex;gap:4px}
.kb button{flex:1;font-size:13px}
.kb a{flex:1;text-align:center;font-size:13px;color:var(--accent);border:1px solid #2c3b4a;border-radius:6px;padding:6px}
code,pre{background:#0b121a;border-radius:4px;padding:0 4px;font-family:ui-monospace,monospace}
pre{padding:6px;overflow-x:auto}
blockquote{border-left:3px solid var(--accent);margin:4px 0;padding-left:8px}
a{color:var(--accent)}
form{display:flex;gap:8px;padding:10px 16px;background:var(--panel)}
form input{flex:1}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;display:none}
#cmds{display:flex;gap:4px;flex-wrap:wrap;padding:0 16px 8px;background:var(--panel)}
#cmds button{font-size:12px;padding:3px 8px}
</style>
</head>
<body>
<header>
  <label>bot <select id="bot"></select></label>
  <label>bot name <input id="botName" placeholder="finance" size="10"></label>
  <label>user id <input id="uid" type="number" value="424242"></label>
  <label>name <input id="uname" value="Tester" size="10"></label>
  <label>lang <input id="lang" value="en" size="3"></label>
  <button id="reset" type="button">reset all</button>
</header>
<div id="cmds"></div>
<div id="log"></div>
<div id="toast"></div>
<form id="send"><input id="text" placeholder="Message or /command" autocomplete="off"><button>Send</button></form>
<script>
const $ = (id) => document.getElementById(id);
const ALLOWED = new Set(["B","STRONG","I","EM","U","INS","S","STRIKE","DEL","SPAN","TG-SPOILER","A","CODE","PRE","BLOCKQUOTE","TG-EMOJI"]);
let after = 0, polling = null;

function bot() { return $("botName").value.trim() || $("bot").value; }
function user() { return { id: Number($("uid").value), first_name: $("uname").value, language_code: $("lang").value }; }

function sanitize(node) {
  for (const child of [...node.childNodes]) {
    if (child.nodeType === 1) {
      if (!ALLOWED.has(child.tagName)) { child.replaceWith(document.createTextNode(child.textContent)); continue; }
      for (const attr of [...child.attributes]) if (!(child.tagName === "A" && attr.name === "href")) child.removeAttribute(attr.name);
      if (child.tagName === "A" && !/^(https?|tg):/i.test(child.getAttribute("href") || "")) child.removeAttribute("href");
      sanitize(child);
    }
  }
  return node;
}

function render(rec) {
  const m = rec.message, el = document.createElement("div");
  el.className = "msg " + (rec.outgoing ? "bot" : "user");
  const body = document.createElement("div");
  if (rec.parse_mode && rec.parse_mode.toUpperCase() === "HTML") {
    const doc = new DOMParser().parseFromString("<div>" + m.text + "</div>", "text/html");
    body.append(...sanitize(doc.body.firstChild).childNodes);
  } else body.textContent = m.text;
  el.append(body);
  const kb = m.reply_markup && m.reply_markup.inline_keyboard;
  if (kb && kb.length) {
    const grid = document.createElement("div"); grid.className = "kb";
    for (const row of kb) {
      const r = document.createElement("div"); r.className = "row";
      for (const b of row) {
        if (b.url) { const a = document.createElement("a"); a.href = b.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = b.text + " ↗"; r.append(a); continue; }
        const btn = document.createElement("button"); btn.type = "button"; btn.textContent = b.text;
        btn.onclick = () => press(m.message_id, b.callback_data);
        r.append(btn);
      }
      grid.append(r);
    }
    el.append(grid);
  }
  const meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = "#" + m.message_id + (m.edit_date ? " · edited" + (rec.history ? " ×" + rec.history.length : "") : "");
  el.append(meta);
  return el;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

async function refresh() {
  const recs = await api(`/_emu/bots/${encodeURIComponent(bot())}/chats/${user().id}/messages`);
  const log = $("log"), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
  log.replaceChildren(...recs.map(render));
  if (stick) log.scrollTop = log.scrollHeight;
  const info = await api(`/_emu/bots/${encodeURIComponent(bot())}`);
  $("cmds").replaceChildren(...info.commands.map((c) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = "/" + c.command; b.title = c.description;
    b.onclick = () => send("/" + c.command); return b;
  }));
}

function toast(text) {
  if (!text) return;
  const t = $("toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 2500);
}

async function poll() {
  const mine = polling = {};
  while (polling === mine) {
    try {
      const evs = await api(`/_emu/bots/${encodeURIComponent(bot())}/events?after=${after}&timeout=25s`);
      if (polling !== mine) return;
      for (const e of evs) { after = Math.max(after, e.seq); if (e.kind === "callback_answer") toast(e.text); }
      if (evs.length) await refresh();
    } catch (e) { await new Promise((r) => setTimeout(r, 1000)); }
  }
}

async function send(text) {
  await api(`/_emu/bots/${encodeURIComponent(bot())}/messages`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ from: user(), text }) });
}

async function press(messageId, data) {
  try {
    await api(`/_emu/bots/${encodeURIComponent(bot())}/callbacks`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ from: user(), message_id: messageId, data }) });
  } catch (e) { toast(e.message); }
}

async function loadBots() {
  const bots = await api("/_emu/bots");
  const sel = $("bot"), cur = sel.value;
  sel.replaceChildren(...bots.map((b) => { const o = document.createElement("option"); o.value = b.name; o.textContent = b.username; return o; }));
  if (cur) sel.value = cur;
}

async function switchBot() { after = 0; await refresh().catch(() => {}); poll(); }

$("send").onsubmit = async (e) => { e.preventDefault(); const t = $("text").value; if (!t) return; $("text").value = ""; await send(t).catch((err) => toast(err.message)); };
$("bot").onchange = switchBot;
$("botName").onchange = switchBot;
$("uid").onchange = switchBot;
$("reset").onclick = async () => { await api("/_emu/reset", { method: "POST" }); after = 0; await refresh(); };
loadBots().then(switchBot);
setInterval(loadBots, 5000);
</script>
</body>
</html>
