appId: dev.familymanager.recipes
name: "Recipes: detail screen"
tags:
  - recipes
  - detail
---
- launchApp
- assertVisible: "The family cookbook"

- tapOn: "Recipes"
- tapOn: "Test Pancakes"

- assertVisible: "Test Pancakes"
- assertVisible: "Batches"
- assertVisible: "Flour"

- tapOn: "Steps"
- assertVisible: "Mix flour with water"

- tapOn: "Notes"
- assertVisible: "Add a note"

- tapOn: "Ingredients"
- assertVisible: "Add to plan"

- tapOn:
    label: "Back"
