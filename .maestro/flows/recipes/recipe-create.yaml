appId: dev.familymanager.recipes
name: "Recipes: create recipe"
tags:
  - recipes
  - create
---
- launchApp
- assertVisible: "The family cookbook"

- tapOn: "Recipes"
- tapOn:
    label: "Add recipe"
- assertVisible: "New recipe"

- tapOn: "Name"
- inputText: "Test Pancakes"

- tapOn: "Description"
- inputText: "Fluffy test pancakes"

- tapOn: "Servings"
- eraseText
- inputText: "4"

- tapOn:
    text: "Name"
    index: 1
- inputText: "Flour"
- tapOn: "Amount"
- inputText: "200"
- tapOn: "Unit"
- inputText: "g"

- tapOn: "Instruction"
- inputText: "Mix flour with water"

- tapOn: "Save recipe"

- extendedWaitUntil:
    visible: "Test Pancakes"
    timeout: 5000
