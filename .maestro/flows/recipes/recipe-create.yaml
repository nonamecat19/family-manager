appId: dev.familymanager.recipes
name: "Recipes: create recipe"
tags:
  - recipes
  - create
---
- launchApp
- assertVisible: "The family\\scookbook"

- tapOn: "Recipes"
- tapOn:
    text: "Add recipe"
- extendedWaitUntil:
    visible: "New recipe"
    timeout: 10000

- tapOn: "Name"
- inputText: "Test Pancakes"

- tapOn: "Description"
- inputText: "Fluffy test pancakes"

- tapOn: "Servings"
- eraseText
- inputText: "4"

- hideKeyboard
- scrollUntilVisible:
    element: "Chestnut mushrooms"
- tapOn: "Chestnut mushrooms"
- inputText: "Flour"
- tapOn: "300"
- inputText: "200"
- tapOn: "^g$"
- inputText: "g"
- hideKeyboard
- scrollUntilVisible:
    element: "Sweat the onion and carrot in butter until soft."
- tapOn: "Sweat the onion and carrot in butter until soft."
- inputText: "Mix flour with water"
- hideKeyboard
- scrollUntilVisible:
    element: "Save recipe"
- tapOn: "Save recipe"

- extendedWaitUntil:
    visible: "Test Pancakes"
    timeout: 5000
