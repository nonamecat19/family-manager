# Favorites: heart a recipe, open Favourites from Home, unheart it again.
# Requires at least one recipe (run after recipe-create).
appId: dev.familymanager.recipes
name: "Recipes: favorites flow"
tags:
  - recipes
  - favorites
---
- launchApp
- assertVisible: "The family cookbook"

- tapOn: "Recipes"
- tapOn: "Test Pancakes"
- assertVisible: "Test Pancakes"

- tapOn:
    label: "Add to favourites"
- extendedWaitUntil:
    visible:
      label: "Remove from favourites"
    timeout: 5000

- tapOn:
    label: "Back"
- tapOn: "Home"
- tapOn: "The ones you keep coming back to"
- assertVisible: "Favourites"
- assertVisible: "Test Pancakes"
