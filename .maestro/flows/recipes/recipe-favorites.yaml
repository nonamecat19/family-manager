appId: dev.familymanager.recipes
name: "Recipes: favorites flow"
tags:
  - recipes
  - favorites
---
- launchApp
- assertVisible: "The family\\scookbook"

- tapOn: "Recipes"
- tapOn: "Test Pancakes"
- assertVisible: "Test Pancakes"

- tapOn:
    text: "Add to favourites"
- extendedWaitUntil:
    visible:
      text: "Remove from favourites"
    timeout: 5000

- tapOn:
    text: "Back"
- tapOn: "Home"
- tapOn: "The ones you keep coming back to"
- assertVisible: "Favourites"
- assertVisible: "Test Pancakes"
