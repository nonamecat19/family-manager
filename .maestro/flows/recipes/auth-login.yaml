appId: dev.familymanager.recipes
name: "Auth: login"
tags:
  - auth
---
- launchApp:
    clearState: true
- assertVisible: "Family Recipes"

- tapOn: "Email"
- inputText: ${TEST_EMAIL || 'testchef@example.com'}
- tapOn: "Password"
- inputText: ${TEST_PASSWORD || 'testpass123'}

- hideKeyboard
- tapOn: "Sign in"

- extendedWaitUntil:
    visible: "The family\\scookbook"
    timeout: 10000
