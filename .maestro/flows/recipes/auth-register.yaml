# Login flow: register a new account, then verify the app navigates past the auth screen.
# Requires a running backend (auth + family services via `just up`).
appId: dev.familymanager.recipes
name: "Auth: register and sign in"
tags:
  - auth
---
- launchApp:
    clearState: true
- assertVisible: "Family Recipes"

# Switch to register mode
- tapOn: "Create an account"

- tapOn: "Name"
- inputText: "Test Chef"
- tapOn: "Email"
- inputText: "testchef@example.com"
- tapOn: "Password"
- inputText: "testpass123"

- tapOn: "Create account"

# Either the household onboarding screen or Home, depending on whether a family exists.
- extendedWaitUntil:
    visible: "Start your"
    timeout: 10000
