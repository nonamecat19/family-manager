appId: dev.familymanager.recipes
name: "Auth: register and sign in"
tags:
  - auth
---
- launchApp:
    clearState: true
- assertVisible: "Family Recipes"

- tapOn: "Create an account"

- tapOn: "Name"
- inputText: "Test Chef"
- tapOn: "Email"
- inputText: "testchef@example.com"
- tapOn: "Password"
- inputText: "testpass123"

- tapOn: "Create account"

- extendedWaitUntil:
    visible: "Start your"
    timeout: 10000
