appId: dev.familymanager.recipes
name: "Recipes: list screen"
tags:
  - recipes
---
- launchApp
- assertVisible: "The family\\scookbook"

- tapOn: "Recipes"
- assertVisible: "All recipes"

- tapOn: "Filter"
- assertVisible: "MAX TIME|Max time"
- back
- extendedWaitUntil:
    notVisible: "MAX TIME"
    timeout: 5000

- assertVisible:
    text: "Add recipe"
