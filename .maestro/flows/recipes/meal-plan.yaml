appId: dev.familymanager.recipes
name: "Recipes: plan and shopping list"
tags:
  - recipes
  - meal-plan
---
- launchApp
- assertVisible: "The family cookbook"

- tapOn: "Recipes"
- tapOn: "Test Pancakes"
- tapOn: "Add to plan"

- assertVisible: "Plan"
- assertVisible: "Test Pancakes"

- tapOn: "Week"
- assertVisible: "MON"
- tapOn:
    text: "Nothing planned"
    index: 0
- assertVisible: "Plan a meal"
- tapOn: "Dinner"
- tapOn: "Test Pancakes"
- extendedWaitUntil:
    visible: "Test Pancakes"
    timeout: 5000

- tapOn: "Basket"
- tapOn: "List"
- assertVisible: "Shopping list"
- extendedWaitUntil:
    visible: "Flour"
    timeout: 5000
- tapOn: "Flour"
