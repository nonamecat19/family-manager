# Plan: basket a recipe, plan it into the week, then check the shopping list totals it.
# Requires at least one recipe (run after recipe-create).
appId: dev.familymanager.recipes
name: "Recipes: plan and shopping list"
tags:
  - recipes
  - meal-plan
---
- launchApp
- assertVisible: "The family cookbook"

# Add a recipe to the basket from its own screen
- tapOn: "Recipes"
- tapOn: "Test Pancakes"
- tapOn: "Add to plan"

- assertVisible: "Plan"
- assertVisible: "Test Pancakes"

# The week half of the plan
- tapOn: "Week"
- assertVisible: "MON"
- tapOn:
    text: "Nothing planned"
    index: 0
- assertVisible: "Plan a meal"
- tapOn: "Dinner"
- tapOn: "Test Pancakes"
- extendedWaitUntil:
    visible: "Test Pancakes"
    timeout: 5000

# Back to the basket, then on to the shopping list
- tapOn: "Basket"
- tapOn: "List"
- assertVisible: "Shopping list"
- extendedWaitUntil:
    visible: "Flour"
    timeout: 5000
- tapOn: "Flour"
