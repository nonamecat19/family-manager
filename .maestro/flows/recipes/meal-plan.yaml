# Meal plan: navigate to the meal plan tab, verify the calendar, add a meal, check totals.
# Requires at least one recipe (run after recipe-create).
appId: dev.familymanager.recipes
name: "Recipes: meal plan flow"
tags:
  - recipes
  - meal-plan
---
- launchApp
- assertVisible: "Recipes"

# Navigate to the meal plan tab
- tapOn: "Meal Plan"
- assertVisible: "Meal Plan"

# Verify the week calendar is visible
- assertVisible: "Sun"

# Toggle to ingredients view
- tapOn: "🛒 Ingredients"
- assertVisible: "No ingredients to total"

# Toggle back to calendar
- tapOn: "📅 Calendar"

# Quick-add a recipe to today's dinner
- assertVisible: "Quick add to today"
- tapOn: "Test Pancakes"
- tapOn: "Add to dinner"

# Verify the meal appears in the calendar
- extendedWaitUntil:
    visible: "Test Pancakes"
    timeout: 5000

# Switch to ingredients to verify totals are computed
- tapOn: "🛒 Ingredients"
- waitForAnimationToEnd