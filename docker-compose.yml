services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 2s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # --- application services -------------------------------------------------
  # Each owns its own database and applies its own migrations at boot. All speak
  # Connect/JSON to apps and gRPC to each other on the same port (h2c).

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      AUTH_DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-root}@postgres:5432/auth?sslmode=disable
      # The ES256 signing key. Generate one with:
      #   openssl ecparam -name prime256v1 -genkey -noout -out infra/secrets/auth-signing-key.pem
      # There is no default: an auth service that invents its own key is worse than one that
      # refuses to start.
      AUTH_SIGNING_KEY_FILE: /run/secrets/auth-signing-key
      # family's internal listener, for the family_id claim. Reachable only on this network.
      AUTH_FAMILY_ADDR: http://family:9090
      AUTH_HTTP_PORT: "8080"
      AUTH_LOG_JSON: "true"
    secrets:
      - auth-signing-key
    ports:
      - "${AUTH_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # No container healthcheck: the distroless image has no shell and no wget. /healthz is
    # served for the reverse proxy and for host-side probes instead.

  family:
    build:
      context: .
      dockerfile: services/family/Dockerfile
    environment:
      FAMILY_DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-root}@postgres:5432/family?sslmode=disable
      FAMILY_JWKS_URL: ${JWKS_URL:-http://auth:8080/.well-known/jwks.json}
      FAMILY_NATS_URL: nats://nats:4222
      FAMILY_HTTP_PORT: "8080"
      # Internal gRPC listener. Never published to the host: it serves the procedures that
      # take a user id as an argument instead of reading it from a token.
      FAMILY_GRPC_PORT: "9090"
      FAMILY_LOG_JSON: "true"
    ports:
      - "${FAMILY_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      auth:
        condition: service_started
    # No container healthcheck: the distroless image has no shell and no wget. /healthz is
    # served for the reverse proxy and for host-side probes instead.

  finance:
    build:
      context: .
      dockerfile: services/finance/Dockerfile
    environment:
      FINANCE_DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-root}@postgres:5432/finance?sslmode=disable
      FINANCE_JWKS_URL: ${JWKS_URL:-http://auth:8080/.well-known/jwks.json}
      FINANCE_NATS_URL: nats://nats:4222
      FINANCE_HTTP_PORT: "8080"
      FINANCE_BASE_CURRENCY: ${BASE_CURRENCY:-EUR}
      FINANCE_LOG_JSON: "true"
    ports:
      - "${FINANCE_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      auth:
        condition: service_started
    # No container healthcheck: the distroless image has no shell and no wget. /healthz is
    # served for the reverse proxy and for host-side probes instead.

  recipes:
    build:
      context: .
      dockerfile: services/recipes/Dockerfile
    environment:
      RECIPES_DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-root}@postgres:5432/recipes?sslmode=disable
      RECIPES_JWKS_URL: ${JWKS_URL:-http://auth:8080/.well-known/jwks.json}
      RECIPES_NATS_URL: nats://nats:4222
      RECIPES_HTTP_PORT: "8080"
      # Local dev is MinIO; production overrides these for Cloudflare R2 (provider "r2",
      # an account-scoped endpoint and a public custom domain). See docs/adr/0007.
      RECIPES_STORAGE_PROVIDER: minio
      RECIPES_STORAGE_ENDPOINT: minio:9000
      RECIPES_STORAGE_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      RECIPES_STORAGE_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      RECIPES_STORAGE_BUCKET: recipes
      # The app fetches images through the host-mapped MinIO port, not the in-network
      # "minio:9000" address the service itself uses to talk to the API.
      RECIPES_STORAGE_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}
      RECIPES_LOG_JSON: "true"
    ports:
      - "${RECIPES_PORT:-8084}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_started
      auth:
        condition: service_started
    # No container healthcheck: the distroless image has no shell and no wget. /healthz is
    # served for the reverse proxy and for host-side probes instead.

secrets:
  auth-signing-key:
    file: ./infra/secrets/auth-signing-key.pem

volumes:
  pgdata:
  miniodata:
  natsdata:
