services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 2s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # --- application services -------------------------------------------------
  # Each owns its own database and applies its own migrations at boot. Both speak
  # Connect/JSON to apps and gRPC to each other on the same port (h2c).

  family:
    build:
      context: .
      dockerfile: services/family/Dockerfile
    environment:
      FAMILY_DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-root}@postgres:5432/family?sslmode=disable
      # No default: services/auth does not serve JWKS yet and is not a compose service, so a
      # default here would point at a host that does not resolve. Set JWKS_URL explicitly.
      FAMILY_JWKS_URL: ${JWKS_URL:?set JWKS_URL to the auth service key set}
      FAMILY_NATS_URL: nats://nats:4222
      FAMILY_HTTP_PORT: "8080"
      FAMILY_LOG_JSON: "true"
    ports:
      - "${FAMILY_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    # No container healthcheck: the distroless image has no shell and no wget. /healthz is
    # served for the reverse proxy and for host-side probes instead.

  finance:
    build:
      context: .
      dockerfile: services/finance/Dockerfile
    environment:
      FINANCE_DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-root}@postgres:5432/finance?sslmode=disable
      FINANCE_JWKS_URL: ${JWKS_URL:?set JWKS_URL to the auth service key set}
      FINANCE_NATS_URL: nats://nats:4222
      FINANCE_HTTP_PORT: "8080"
      FINANCE_BASE_CURRENCY: ${BASE_CURRENCY:-EUR}
      FINANCE_LOG_JSON: "true"
    ports:
      - "${FINANCE_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    # No container healthcheck: the distroless image has no shell and no wget. /healthz is
    # served for the reverse proxy and for host-side probes instead.

volumes:
  pgdata:
  miniodata:
  natsdata:
